<script>
'use strict';
const STOCKS = [
 {id:'00700',name:'腾讯控股',en:'TENCENT',sector:'互联网',price:42860,prev:42020},
 {id:'09988',name:'阿里巴巴-W',en:'BABA-W',sector:'互联网',price:16610,prev:16250},
 {id:'01810',name:'小米集团-W',en:'XIAOMI-W',sector:'科技',price:3842,prev:3896},
 {id:'03690',name:'美团-W',en:'MEITUAN-W',sector:'互联网',price:10250,prev:10110},
 {id:'00388',name:'香港交易所',en:'HKEX',sector:'金融',price:39720,prev:39960},
 {id:'09618',name:'京东集团-SW',en:'JD-SW',sector:'互联网',price:12240,prev:11980},
 {id:'09999',name:'网易-S',en:'NETEASE-S',sector:'互联网',price:18380,prev:18160},

const ICONS={
 search:'<circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.2 4.2"/>',
 back:'<path d="m14.5 5-7 7 7 7"/>',chevron:'<path d="m9 5 7 7-7 7"/>',
 star:'<path d="m12 3 2.8 5.8 6.4.9-4.6 4.5 1.1 6.4-5.7-3-5.7 3 1.1-6.4L2.8 9.7l6.4-.9Z"/>',
 watch:'<path d="M4 4h16v16H4zM8 8v8m4-5v5m4-9v9"/>',

 trade:'<path d="M4 7h15m-4-4 4 4-4 4M20 17H5m4-4-4 4 4 4"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4.5 21v-2a7.5 7.5 0 0 1 15 0v2"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',
 up:'<path d="m6 14 6-6 6 6"/>',down:'<path d="m6 10 6 6 6-6"/>',
 check:'<path d="m5 12 4.5 4.5L19 7"/>',list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
 wallet:'<path d="M20 7H5a2 2 0 0 1 0-4h13v4M4 7v13h16V7M20 11h-6v5h6M16 13.5h.01"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',
 eye:'<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.7"/>',
 sail:'<path d="M11 3v13H3L11 3ZM14 7l6 9h-6V7ZM3 20h18"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
};
const icon=(name,fill=false)=>`<svg viewBox="0 0 24 24" fill="${fill?'currentColor':'none'}" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||ICONS.info}</svg>`;
ICONS.settings='<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/><circle cx="8" cy="18" r="2" fill="currentColor"/>';
ICONS.more='<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>';
ICONS.bag='<path d="M5 8h14l1 13H4L5 8ZM8 8V6a4 4 0 0 1 8 0v2"/>';
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=cents=>(cents/100).toLocaleString('en-HK',{minimumFractionDigits:2,maximumFractionDigits:2});
const plain=cents=>(cents/100).toFixed(2);
const signed=(value,digits=2)=>(value>=0?'+':'')+value.toLocaleString('en-HK',{minimumFractionDigits:digits,maximumFractionDigits:digits});
const stock=id=>STOCKS.find(s=>s.id===id)||STOCKS[0];
const delta=s=>(s.price-s.prev)/s.prev*100;
const tone=value=>value>=0?'up':'down';
const defaults=()=>STOCKS.slice(0,6).map(s=>s.id);
const STORAGE_KEY='harbor-mobile-prototype-v2';
function newUser(name,email,password,demo=false){return {name,email,password,cash:18268050,watch:defaults(),positions:demo?{'00700':{qty:200,cost:8164800},'09988':{qty:300,cost:4563000},'01810':{qty:1000,cost:3681000}}:{},orders:[],trades:[]};}
function initialDB(){return {version:2,active:null,users:{'demo@harbor.app':newUser('林同学','demo@harbor.app','Harbor2026!',true)}};}
let db=initialDB(),storageAvailable=true;
try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));if(saved?.version===2&&saved.users?.['demo@harbor.app'])db=saved;}catch{storageAvailable=false;}
const user=()=>db.users[db.active]||null;
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db));}catch{storageAvailable=false;}}
const active=o=>o.status==='OPEN'||o.status==='PARTIALLY_FILLED';
const fee=notional=>Math.max(100,Math.ceil(notional*3/10000));
function account(u){const frozen=u.orders.filter(o=>active(o)&&o.side==='BUY').reduce((a,o)=>a+o.reserved-o.spent,0),value=Object.entries(u.positions).reduce((a,[id,p])=>a+p.qty*stock(id).price,0),cost=Object.values(u.positions).reduce((a,p)=>a+p.cost,0);return {frozen,available:u.cash-frozen,value,total:u.cash+value,pnl:value-cost};}
function sellable(u,id){return (u.positions[id]?.qty||0)-u.orders.filter(o=>active(o)&&o.side==='SELL'&&o.idStock===id).reduce((a,o)=>a+o.qty-o.filled,0);}
function settle(){let changed=false;for(const u of Object.values(db.users)){for(const o of u.orders){if(!active(o))continue;const s=stock(o.idStock),price=s.price+(o.side==='BUY'?1:-1);if(o.side==='BUY'?price>o.price:price<o.price)continue;const qty=Math.min(100,o.qty-o.filled),notional=price*qty,newFee=fee(o.notional+notional),extraFee=newFee-o.fee;let p=u.positions[o.idStock];if(o.side==='BUY'){u.cash-=notional+extraFee;o.spent+=notional+extraFee;if(!p)p=u.positions[o.idStock]={qty:0,cost:0};p.qty+=qty;p.cost+=notional+extraFee;}else{const removed=Math.round(p.cost*qty/p.qty);p.qty-=qty;p.cost-=removed;if(!p.qty)delete u.positions[o.idStock];u.cash+=notional-extraFee;}o.filled+=qty;o.notional+=notional;o.fee=newFee;o.status=o.filled===o.qty?'FILLED':'PARTIALLY_FILLED';u.trades.push({orderId:o.id,idStock:o.idStock,side:o.side,price,qty,fee:extraFee,time:new Date().toLocaleTimeString('en-GB',{hour12:false})});changed=true;}}if(changed)save();return changed;}
const averageLabel=o=>o.filled?'均价 '+plain(o.notional/o.filled)+' HKD':active(o)?'等待成交':'无成交';
const orderStatus=o=>({OPEN:'待成交',PARTIALLY_FILLED:'部分成交',FILLED:'已成交',CANCELED:'已撤单'})[o.status]||o.status;
const clone=value=>JSON.parse(JSON.stringify(value));
const tabNames={watch:'自选',market:'市场',account:'账户'};
let activeTab='watch',stacks={watch:[{page:'watch'}],market:[{page:'market'}],account:[{page:'account'}]},task=null,entry=0;
let afterPop=null,afterAuth=null,returnFocus=null,toastTimer=null,tick=0,historyOK=true;
const drafts=new Map(),workspace=document.getElementById('workspace'),taskLayer=document.getElementById('task-layer');
const current=()=>stacks[activeTab].at(-1);
const snapshot=()=>clone({activeTab,stack:stacks[activeTab],task,entry,owner:db.active});
let memoryHistory=[];
function writeHistory(push=false){
 if(push)entry++;
 const state=snapshot(),fragment=task?'task-'+task.type+'-'+(task.stage||'login'):activeTab+'/'+current().page;
 memoryHistory[entry]=state;
 if(historyOK)try{history[push?'pushState':'replaceState'](state,'','#'+fragment);}catch{historyOK=false;}
}
function rememberScroll(){const el=workspace.querySelector('.screen');if(el)current().scroll=el.scrollTop;}
function applyHistory(state){
 const previousTask=task,oldPage=current();
 if(previousTask?.type==='trade'&&previousTask.stage==='edit')drafts.set(previousTask.id+':'+previousTask.side,{price:previousTask.price,qty:previousTask.qty});
 activeTab=state?.activeTab||'watch';stacks[activeTab]=clone(state?.stack||[{page:activeTab}]);task=clone(state?.task||null);entry=state?.entry||0;
 if(state?.owner!==db.active){stacks[activeTab]=stacks[activeTab].filter(r=>!['orders','order','settings','rules','manage'].includes(r.page));task=null;}
 if(previousTask?.type==='auth'&&task?.type!=='auth')afterAuth=null;
 if(afterPop){const callback=afterPop;afterPop=null;callback();return;}
 if(oldPage.page!==current().page||oldPage.id!==current().id||previousTask===null&&task===null)renderRoot();
 renderTask();
}
window.addEventListener('popstate',event=>applyHistory(event.state));
function goBack(count=1){if(historyOK)history.go(-count);else applyHistory(memoryHistory[Math.max(0,entry-count)]);}
function push(route){rememberScroll();writeHistory();stacks[activeTab].push(route);writeHistory(true);renderRoot(true);}
function back(){if(stacks[activeTab].length>1)goBack();}
function selectTab(tab){
 if(tab===activeTab)return;
 rememberScroll();
 const saved=clone(stacks),navigate=()=>{
  stacks=saved;activeTab=tab;task=null;entry=0;
  const routes=[...stacks[tab]];stacks[tab]=[routes[0]];writeHistory();
  for(const route of routes.slice(1)){stacks[tab].push(route);writeHistory(true);}
  renderRoot();
 };
 if(entry>0){afterPop=navigate;goBack(entry);}else navigate();
}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2600);}
function ask(title,message,label,callback){const dialog=document.getElementById('confirm-dialog');document.getElementById('confirm-title').textContent=title;document.getElementById('confirm-message').textContent=message;document.getElementById('dialog-accept').textContent=label;document.getElementById('dialog-accept').onclick=()=>{dialog.close();callback();};document.getElementById('dialog-cancel').onclick=()=>dialog.close();dialog.showModal();}
function present(value){rememberScroll();writeHistory();returnFocus=document.activeElement;task={...value,level:1};writeHistory(true);renderTask();}
function closeTask(callback){if(!task)return;const previous=task;if(previous.type==='trade'&&previous.stage==='edit')drafts.set(previous.id+':'+previous.side,{price:previous.price,qty:previous.qty});afterPop=()=>{task=null;renderTask();if(callback)callback();};goBack(previous.level||1);}
function requireUser(callback){if(user())callback();else{afterAuth=callback;present({type:'auth',mode:'login'});}}
function beginTrade(id,side='BUY'){requireUser(()=>{const draft=drafts.get(id+':'+side);present({type:'trade',stage:'edit',id,side,price:draft?.price||plain(stock(id).price+(side==='BUY'?1:-1)),qty:draft?.qty||'100'});});}
function login(email){if(db.active!==email){drafts.clear();for(const tab of Object.keys(stacks))stacks[tab]=stacks[tab].filter(r=>!['orders','order','settings','rules','manage'].includes(r.page));}db.active=email;save();const callback=afterAuth;afterAuth=null;closeTask(()=>{renderRoot();if(callback)callback();toast('已登录 '+user().name);});}
function viewOrder(id){const navigate=()=>{rememberScroll();activeTab='account';stacks.account=[{page:'account'}];writeHistory();push({page:'orders',view:'orders',filter:'all'});push({page:'order',orderId:id});};if(task)closeTask(navigate);else push({page:'order',orderId:id});}
function logout(){db.active=null;drafts.clear();afterAuth=null;save();for(const tab of Object.keys(stacks))stacks[tab]=stacks[tab].filter(r=>!['orders','order','settings','rules','manage'].includes(r.page));writeHistory();renderRoot();toast('已退出登录');}
const priceHTML=s=>`<span class="number" data-price="${s.id}">${plain(s.price)}</span>`;
const changeHTML=s=>`<span class="number ${tone(delta(s))}" data-percent="${s.id}">${signed(delta(s))}%</span>`;
const cashHTML=(field,value,masked=false,sign=false)=>`<span class="number ${sign?tone(value):''}" data-money="${field}" data-masked="${masked}" data-signed="${sign}">${masked?'••••••':sign?signed(value/100):money(value)}</span>`;
function rootHeader(title,meta,actions){return `<header class="root-header"><div class="header-top"><h1 tabindex="-1">${title}</h1><div class="actions">${actions}</div></div><div class="header-meta">${meta}<span class="sim-tag">模拟</span></div></header>`;}
const searchButton=`<button class="icon-button" data-action="search" aria-label="搜索股票">${icon('search')}</button>`;
function pageNav(title,subtitle='',right=''){return `<header class="page-nav"><button class="back-button" data-action="back" aria-label="返回${stacks[activeTab].length>2?'上一级':tabNames[activeTab]}">${icon('back')}<span>${stacks[activeTab].length>2?'返回':tabNames[activeTab]}</span></button><div><h1 tabindex="-1">${esc(title)}</h1>${subtitle?`<small>${esc(subtitle)}</small>`:''}</div><div class="nav-right">${right||'<span class="nav-placeholder"></span>'}</div></header>`;}
function tabs(){return `<nav class="tabbar" aria-label="主导航">${[['watch','star','自选'],['market','market','市场'],['account','wallet','账户']].map(([tab,i,label])=>`<button class="tab ${activeTab===tab?'selected':''}" data-action="tab" data-tab="${tab}" ${activeTab===tab?'aria-current="page"':''}><span class="symbol">${icon(i,activeTab===tab&&i==='star')}</span><span>${label}</span></button>`).join('')}</nav>`;}
function empty(title,text,button='',action='search',i='star'){return `<div class="empty"><div class="empty-icon">${icon(i)}</div><h2>${title}</h2><p>${text}</p>${button?`<button class="primary" data-action="${action}">${button}</button>`:''}</div>`;}
function spark(s,large=false){const rising=s.price>=s.prev,points=Array.from({length:22},(_,i)=>`${i*4.8},${(rising?21-i*.44:9+i*.44)+Math.sin((Number(s.id)+i)*1.6)*4.2}`).join(' ');return `<svg class="${large?'index-spark':'spark'}" viewBox="0 0 103 29" fill="none" aria-hidden="true"><polyline points="${points}" stroke="${s.price>=s.prev?'#b9807a':'#6d9d8c'}" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg>`;}

 return pageNav('委托详情')+`<main class="screen"><section class="card order-hero" data-order-row="${o.id}"><span class="status-label ${active(o)?'':'terminal'}" data-order-field="status">${orderStatus(o)}</span><h2>${stock(o.idStock).name}</h2><p>${o.side==='BUY'?'买入':'卖出'} · HK ${o.idStock} · 限价单</p><div class="order-progress"><span data-order-field="progress" style="width:${o.filled/o.qty*100}%"></span></div><div class="order-progress-label"><span>已成交 <b class="number" data-order-field="filled">${o.filled}</b> / ${o.qty} 股</span><span class="number" data-order-field="average">${averageLabel(o)}</span></div></section><section class="card card-pad" style="margin-top:13px" data-order-row="${o.id}"><div class="kv"><span>委托价格</span><span class="number">${plain(o.price)} HKD</span></div><div class="kv"><span>委托数量</span><span class="number">${o.qty} 股</span></div><div class="kv"><span>累计佣金</span><span class="number" data-order-field="fee">${money(o.fee)} HKD</span></div><div class="kv"><span>有效期</span><span>当日有效</span></div><div class="kv"><span>委托时间</span><span class="number">${o.date}<br>${o.time}</span></div><div class="kv"><span>委托编号</span><span class="number tiny">${o.id}</span></div></section><p class="note" data-order-explanation="${o.id}"></p></main>`;

function makeCandles(s,period){
 const seed=Number(s.id),count=period==='min'?40:32;
 return Array.from({length:count},(_,i)=>{
  const base=s.price*(.92+i/count*.08),wave=Math.sin((i+seed)*1.39)*s.price*.014;
  let close=Math.round(base+wave),open=Math.round(base+Math.sin((i+seed)*2.1)*s.price*.01);
  if(i===count-1){close=s.price;open=period==='min'?s.price-12:s.prev+32;}
  const date=new Date(Date.UTC(2026,10,10));
  if(period==='week')date.setUTCDate(date.getUTCDate()-(count-1-i)*7);
  else if(period==='month')date.setUTCMonth(date.getUTCMonth()-(count-1-i));
  else date.setUTCDate(date.getUTCDate()-(count-1-i));
  const label=period==='min'?`10:${String(i).padStart(2,'0')}`:period==='month'?`${date.getUTCFullYear()}/${date.getUTCMonth()+1}`:`${date.getUTCMonth()+1}/${String(date.getUTCDate()).padStart(2,'0')}`;
  return {open,close,high:Math.max(open,close)+Math.round(s.price*.006),low:Math.min(open,close)-Math.round(s.price*.006),volume:15+(i*17+seed)%65,label};
 });
}
function candlesFor(r){const p=r.period||'day';r.series||={};return r.series[p]||=(makeCandles(stock(r.id),p));}
function chartReadout(r){const bars=candlesFor(r),selected=r.cross??bars.length-1,b=bars[selected];return r.cross===undefined?`${b.label} &nbsp; 收 <strong class="number">${plain(b.close)}</strong> &nbsp; <span>成交量 · 模拟</span>`:`${b.label} &nbsp; 开 <strong>${plain(b.open)}</strong> &nbsp; 高 <strong>${plain(b.high)}</strong><br>低 <strong>${plain(b.low)}</strong> &nbsp; 收 <strong>${plain(b.close)}</strong>`;}
function chartSVG(r){const p=r.period||'day',bars=candlesFor(r),W=332,left=2,right=39,top=10,bottom=170,low=Math.min(...bars.map(b=>b.low)),high=Math.max(...bars.map(b=>b.high)),step=(W-left-right)/bars.length,Y=v=>top+(high-v)/(high-low)*(bottom-top);let shapes='';
 for(let i=0;i<4;i++){const y=top+i*(bottom-top)/3,v=high-(high-low)*i/3;shapes+=`<path d="M${left} ${y}H${W-right}" stroke="#eceff3" stroke-dasharray="2 3"/><text x="${W-1}" y="${y+3}" text-anchor="end" font-size="8" fill="#818894">${plain(v)}</text>`;}
 if(p==='min'){const points=bars.map((b,i)=>`${left+(i+.5)*step},${Y(b.close)}`).join(' ');shapes+=`<path d="M${left+step/2} ${bottom}${bars.map((b,i)=>`L${left+(i+.5)*step} ${Y(b.close)}`).join('')}L${left+(bars.length-.5)*step} ${bottom}Z" fill="#f0f4fa"/><polyline points="${points}" stroke="#6b8fb5" stroke-width="1.5" fill="none"/>`;}else bars.forEach((b,i)=>{const x=left+(i+.5)*step,c=b.close>=b.open?'#bc7770':'#639785';shapes+=`<path d="M${x} ${Y(b.high)}V${Y(b.low)}" stroke="${c}"/><rect x="${x-step*.29}" y="${Y(Math.max(b.open,b.close))}" width="${step*.58}" height="${Math.max(1,Math.abs(Y(b.open)-Y(b.close)))}" fill="${c}"/>`;});
 bars.forEach((b,i)=>shapes+=`<rect x="${left+i*step+1}" y="${208-b.volume*.3}" width="${Math.max(2,step-3)}" height="${b.volume*.3}" fill="${b.close>=b.open?'#ddb9b3':'#b1ccbf'}"/>`);
 if(r.cross!==undefined){const b=bars[r.cross],x=left+(r.cross+.5)*step;shapes+=`<path d="M${x} 6V210M${left} ${Y(b.close)}H${W-right}" stroke="#a4aebd" stroke-dasharray="3 3"/><circle cx="${x}" cy="${Y(b.close)}" r="2.5" fill="#6685aa"/>`;}
 shapes+=`<text x="3" y="224" font-size="8" fill="#818894">${bars[0].label}</text><text x="${W-right}" y="224" text-anchor="end" font-size="8" fill="#818894">${bars.at(-1).label}</text>`;
 return `<svg class="chart-svg" viewBox="0 0 332 231" role="img" aria-label="${stock(r.id).name}${p==='min'?'分时':'K线'}图">${shapes}</svg>`;
}
function chartArea(r){const bars=candlesFor(r);return `<div class="periods" aria-label="图表周期">${[['min','分时'],['day','日 K'],['week','周 K'],['month','月 K']].map(([v,t])=>`<button class="${(r.period||'day')===v?'selected':''}" data-action="period" data-value="${v}" aria-pressed="${(r.period||'day')===v}">${t}</button>`).join('')}</div><div class="chart-readout number" id="chart-readout">${chartReadout(r)}</div><div id="chart-graphic">${chartSVG(r)}</div><input class="chart-range" type="range" min="0" max="${bars.length-1}" value="${r.cross??bars.length-1}" aria-label="查看图表历史位置"><div class="chart-caption"><span>历史位置</span><span>合成行情</span></div>`;}
function fundNet(r){r.fundBase??=(stock(r.id).price-stock(r.id).prev)*1200;return r.fundBase*(r.fundRange==='5d'?4.2:r.fundRange==='20d'?15.6:1);}
function fundBody(r){const range=r.fundRange||'today',net=fundNet(r);return `<div class="segment" aria-label="资金分析范围">${[['today','今日'],['5d','5 日'],['20d','20 日']].map(([v,t])=>`<button class="${range===v?'selected':''}" data-action="fund-range" data-value="${v}" aria-pressed="${range===v}">${t}</button>`).join('')}</div>${[['大单',.52],['中单',.31],['小单',.17]].map(([t,m])=>`<div class="fund-row"><span>${t}</span><div class="fund-track"><i style="width:${m*100}%;background:${net>=0?'#c88b83':'#8bb2a2'}"></i></div><span class="number ${tone(net)}">${signed(net*m/1000000)} 万</span></div>`).join('')}<p class="rule-text">按模拟行情估算，与账户余额无关。</p>`;}
function detailPage(r){const s=stock(r.id),watched=user()?.watch.includes(s.id),net=fundNet(r);return pageNav(s.name,'HK '+s.id,`<button class="icon-button ${watched?'star-on':''}" style="background:none" data-action="toggle-watch" data-id="${s.id}" aria-label="${watched?'移除自选':'加入自选'}" aria-pressed="${Boolean(watched)}">${icon('star',watched)}</button>`)+`<main class="screen"><section class="quote-hero"><div class="row"><div><div class="price">${priceHTML(s)}</div><div class="move ${tone(delta(s))}"><span class="number" data-delta="${s.id}">${signed((s.price-s.prev)/100)}</span>${changeHTML(s)}</div></div><div class="quote-context"><span><i class="live-dot"></i>交易中</span><br>HKD · 每手 100 股<br><span data-quote-time>刚刚更新</span></div></div></section><section class="card chart-card" id="chart-area">${chartArea(r)}</section><details data-detail="quote" ${r.quoteOpen?'open':''}><summary>今日行情数据</summary><div class="detail-metrics">${[['今开',s.prev+32],['最高',s.price+105],['最低',s.prev-58],['昨收',s.prev],['成交量','2,384 万'],['成交额','102.4 亿']].map(([k,v])=>`<div class="row"><span>${k}</span><span class="number">${typeof v==='number'?plain(v):v}</span></div>`).join('')}</div></details><section class="card" style="margin-top:12px"><div class="book"><div><span class="book-label">买一</span><b class="number" data-bid="${s.id}">${plain(s.price-1)}</b></div><div><span class="book-label">卖一</span><b class="number" data-ask="${s.id}">${plain(s.price+1)}</b></div></div></section><details data-detail="analysis" ${r.analysisOpen?'open':''}><summary>资金分析 <span class="number ${tone(net)}" id="fund-net">净流入 ${signed(net/1000000)} 万</span></summary><div class="fund-body" id="fund-body">${fundBody(r)}</div></details></main>`;}
function accessory(){const r=current();if(r.page==='detail')return `<div class="accessory"><button class="primary" data-action="trade" data-id="${r.id}">交易</button></div>`;if(r.page==='order'){const o=user()?.orders.find(x=>x.id===r.orderId);return o?`<div class="accessory" data-cancel-area="${o.id}" ${active(o)?'':'hidden'}><button class="outline-button" data-action="cancel-order" data-order="${o.id}" data-cancel-button="${o.id}">撤销剩余 ${o.qty-o.filled} 股</button></div>`:'';}return '';}
function renderRoot(animate=false){
 const r=current();if(['orders','order','settings','rules','manage'].includes(r.page)&&!user()){stacks[activeTab]=[{page:activeTab}];writeHistory();}
 const pages={watch:watchPage,market:marketPage,account:accountPage,search:searchPage,browse:browsePage,manage:managePage,detail:detailPage,orders:ordersPage,order:orderPage,settings:settingsPage,rules:rulesPage};
 workspace.innerHTML=(pages[current().page]||watchPage)(current())+accessory()+tabs();
 const screen=workspace.querySelector('.screen');if(screen){screen.scrollTop=current().scroll||0;if(animate)screen.classList.add('enter');}
 updateLive();
}
function taskNav(title,backButton=false){return `<div class="sheet-handle" aria-hidden="true"></div><header class="sheet-nav">${backButton?`<button class="back-button" data-action="task-back" aria-label="返回填写">${icon('back')}修改</button>`:'<span></span>'}<h2 id="task-title" tabindex="-1">${title}</h2><button class="icon-button" data-action="close-task" aria-label="关闭${title}">${icon('close')}</button></header>`;}
function tradeIdentity(t){const s=stock(t.id);return `<div class="trade-identity"><div><h3>${s.name}</h3><p>HK ${s.id} · 每手 100 股</p></div><div class="quote">${priceHTML(s)}${changeHTML(s)}</div></div>`;}
function tradeForm(t){const a=account(user());return taskNav('委托交易')+`<div class="task-content">${tradeIdentity(t)}<form id="trade-form" novalidate><div class="card form-card"><div class="segment trade-direction" aria-label="交易方向"><button type="button" data-action="side" data-value="BUY" class="${t.side==='BUY'?'selected buy':''}" aria-pressed="${t.side==='BUY'}">买入</button><button type="button" data-action="side" data-value="SELL" class="${t.side==='SELL'?'selected sell':''}" aria-pressed="${t.side==='SELL'}">卖出</button></div><div class="field"><label for="limit-price">委托价格</label><div class="field-control"><input id="limit-price" type="text" name="price" inputmode="decimal" value="${esc(t.price)}" autocomplete="off" aria-describedby="price-error"><span class="unit">HKD</span><button type="button" data-action="opponent">对手价</button></div><p class="field-hint">买一 <span class="number" data-bid="${t.id}">${plain(stock(t.id).price-1)}</span> &nbsp; 卖一 <span class="number" data-ask="${t.id}">${plain(stock(t.id).price+1)}</span></p><p class="field-error" id="price-error" role="alert"></p></div><div class="field"><label for="quantity">委托数量</label><div class="field-control"><input id="quantity" name="quantity" type="text" inputmode="numeric" value="${esc(t.qty)}" autocomplete="off" aria-describedby="quantity-error"><span class="unit">股</span></div><div class="quantity-shortcuts">${[100,200,500].map(q=>`<button type="button" data-action="quantity" data-value="${q}">${q} 股</button>`).join('')}<button type="button" data-action="max-quantity">最大</button></div><p class="field-error" id="quantity-error" role="alert"></p></div></div><div class="available"><span>${t.side==='BUY'?'可用资金':'可卖数量'}</span><strong class="number" id="trade-available">${t.side==='BUY'?money(a.available)+' HKD':sellable(user(),t.id)+' 股'}</strong></div><section class="card estimate"><div class="kv"><span>预估佣金</span><span class="number" id="estimate-fee">—</span></div><div class="kv total"><span>${t.side==='BUY'?'预估支出':'预估收入'}</span><span class="number" id="estimate-total">—</span></div></section><details class="commission-details"><summary>费用与有效期</summary><p>佣金为累计成交额的 0.03%，每笔最低 1 HKD。限价委托当日有效，未成交部分可以撤销。</p></details></form></div><footer class="sheet-footer"><button class="primary" type="submit" form="trade-form">核对${t.side==='BUY'?'买入':'卖出'}委托</button><p>模拟交易 · 不涉及真实资金</p></footer>`;}
function confirmTask(t){const p=t.preview,f=fee(p.price*p.qty);return taskNav('核对委托',true)+`<div class="task-content"><div class="confirm-intro"><h3>${stock(p.id).name} <span class="side-label ${p.side==='SELL'?'sell':''}" style="vertical-align:4px">${p.side==='BUY'?'买入':'卖出'}</span></h3><p>HK ${p.id} · 限价单 · 当日有效</p></div><section class="card card-pad">${[['委托价格',plain(p.price)+' HKD'],['委托数量',p.qty+' 股 / '+p.qty/100+' 手'],['委托金额',money(p.price*p.qty)+' HKD'],['预估佣金',money(f)+' HKD']].map(([k,v])=>`<div class="kv"><span>${k}</span><span class="number">${v}</span></div>`).join('')}<div class="kv total"><span>${p.side==='BUY'?'预估支出':'预估收入'}</span><span class="number">${money(p.price*p.qty+(p.side==='BUY'?f:-f))} HKD</span></div></section><div class="expires" id="countdown">${icon('clock')}<span></span></div><p class="field-error" id="submit-error" role="alert"></p><p class="note">达到限价条件后才会成交，可能分次完成。确认提交后，可在订单中查看进度。</p></div><footer class="sheet-footer"><button class="primary" data-action="submit-order" id="submit-order">确认${p.side==='BUY'?'买入':'卖出'}</button><button class="outline-button" data-action="task-back" id="expired-back" hidden>返回重新核对</button></footer>`;}
function resultTask(t){const o=user().orders.find(x=>x.id===t.orderId);return taskNav('委托反馈')+`<div class="task-content"><div class="result-hero"><div class="result-symbol">${icon('check')}</div><h3>委托已受理</h3><p>${stock(o.idStock).name} · ${o.side==='BUY'?'买入':'卖出'} ${o.qty} 股<br>限价 ${plain(o.price)} HKD</p></div><section class="card result-summary" data-order-row="${o.id}"><div class="kv"><span>当前状态</span><span class="status-label" data-order-field="status">${orderStatus(o)}</span></div><div class="kv"><span>已成交数量</span><span><b class="number" data-order-field="filled">${o.filled}</b> / ${o.qty} 股</span></div></section><p class="note" style="text-align:center">完成后回到发起交易的页面。</p></div><footer class="sheet-footer"><button class="primary" data-action="close-task">完成</button><button class="outline-button" data-action="view-order" data-order="${o.id}">查看订单</button></footer>`;}
function authTask(t){const reg=t.mode==='register';return taskNav(reg?'注册账户':'登录账户')+`<div class="task-content"><div class="auth-intro"><div class="auth-logo">${icon('sail')}</div><h3>${reg?'从海港开始':'欢迎回来'}</h3><p>${reg?'创建模拟账户，体验第一笔交易。':'登录后，继续关注与交易。'}</p></div><form id="auth-form" novalidate><div class="card form-card">${reg?`<div class="field"><label for="auth-name">称呼（选填）</label><div class="field-control"><input class="email" id="auth-name" name="name" value="${esc(t.name||'')}" placeholder="怎么称呼你…" maxlength="24" autocomplete="off"></div></div>`:''}<div class="field"><label for="auth-email">邮箱</label><div class="field-control"><input class="email" id="auth-email" name="email" type="email" inputmode="email" value="${esc(t.email||'')}" placeholder="name@example.com" autocomplete="off" spellcheck="false"></div></div><div class="field"><label for="auth-password">密码</label><div class="field-control"><input class="email" id="auth-password" name="password" type="password" value="${esc(t.password||'')}" placeholder="8–128 位模拟密码…" autocomplete="off" maxlength="128"><button type="button" data-action="password" aria-label="显示密码">显示</button></div></div><p class="field-error" id="auth-error" role="alert"></p></div><button class="primary auth-submit" type="submit">${reg?'注册并登录':'登录'}</button><div class="auth-switch">${reg?'已有账户？':'还没有账户？'}<button type="button" class="text-button" data-action="auth-mode">${reg?'去登录':'注册账户'}</button></div></form><div class="auth-divider">快速体验</div><button class="outline-button" data-action="demo">使用演示账户</button><p class="note" style="text-align:center;font-size:11px">仅用于模拟体验，请使用虚构邮箱和密码。</p></div>`;}
function renderTask(){
 if(!task){taskLayer.hidden=true;taskLayer.innerHTML='';workspace.inert=false;if(returnFocus?.isConnected)returnFocus.focus({preventScroll:true});return;}
 workspace.inert=true;taskLayer.hidden=false;
 const body=task.type==='auth'?authTask(task):task.stage==='confirm'?confirmTask(task):task.stage==='result'?resultTask(task):tradeForm(task);
 taskLayer.innerHTML=`<section class="task-sheet" role="dialog" aria-modal="true" aria-labelledby="task-title">${body}</section>`;
 document.getElementById('task-title').focus({preventScroll:true});
 if(task.type==='trade'&&task.stage==='edit')updateEstimate();
 updateCountdown();updateLive();
}
function validateDraft(t){
 if(!/^\d{1,5}(\.\d{1,2})?$/.test(t.price))return {field:'price',message:'价格最多保留两位小数'};
 const p=Math.round(Number(t.price)*100),q=Number(t.qty);
 if(p<100||p>1000000)return {field:'price',message:'请输入 1.00–10,000.00 HKD 之间的价格'};
 if(!/^\d+$/.test(t.qty)||!Number.isSafeInteger(q)||q<100||q>100000||q%100)return {field:'quantity',message:'数量须为 100 的整数倍，最多 100,000 股'};
 if(t.side==='BUY'&&p*q+fee(p*q)>account(user()).available)return {field:'quantity',message:'可用资金不足，请减少数量或调整价格'};
 if(t.side==='SELL'&&q>sellable(user(),t.id))return {field:'quantity',message:'可卖数量不足，请减少数量'};
 return null;
}
function updateEstimate(){if(task?.type!=='trade'||task.stage!=='edit')return;const p=Math.round(Number(task.price)*100),q=Number(task.qty),valid=Number.isFinite(p)&&p>0&&Number.isSafeInteger(q)&&q>0&&q<=100000,f=valid?fee(p*q):0;document.getElementById('estimate-fee').textContent=valid?money(f)+' HKD':'—';document.getElementById('estimate-total').textContent=valid?money(p*q+(task.side==='BUY'?f:-f))+' HKD':'—';}
function previewTrade(){const error=validateDraft(task);if(error){const input=document.getElementById(error.field==='price'?'limit-price':'quantity');document.getElementById(error.field+'-error').textContent=error.message;input.setAttribute('aria-invalid','true');input.focus();return;}writeHistory();task={...task,stage:'confirm',level:2,preview:{id:task.id,side:task.side,price:Math.round(Number(task.price)*100),qty:Number(task.qty),expires:Date.now()+15000,used:false}};writeHistory(true);renderTask();}
function submitOrder(){
 if(task?.stage!=='confirm'||task.preview.used)return;const p=task.preview;
 if(Date.now()>=p.expires){updateCountdown();return;}
 const error=validateDraft({id:p.id,side:p.side,price:plain(p.price),qty:String(p.qty)});
 if(error){document.getElementById('submit-error').textContent=error.message+'，请返回修改。';return;}
 p.used=true;document.getElementById('submit-order').disabled=true;
 const now=new Date(),o={id:'H'+now.getTime().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase(),idStock:p.id,side:p.side,price:p.price,qty:p.qty,filled:0,notional:0,fee:0,spent:0,reserved:p.price*p.qty+fee(p.price*p.qty),status:'OPEN',date:new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Hong_Kong'}).format(now),time:new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Hong_Kong',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(now)};
 user().orders.push(o);save();drafts.delete(p.id+':'+p.side);
 closeTask(()=>present({type:'trade',stage:'result',orderId:o.id}));
}
function updateCountdown(){if(task?.stage!=='confirm')return;const seconds=Math.max(0,Math.ceil((task.preview.expires-Date.now())/1000)),el=document.getElementById('countdown');if(!el)return;el.querySelector('span').textContent=seconds?`${seconds} 秒内确认有效`:'确认已过期，请返回重新核对';el.classList.toggle('expired',!seconds);document.getElementById('submit-order').disabled=!seconds||task.preview.used;document.getElementById('expired-back').hidden=Boolean(seconds);}
function toggleWatch(id){requireUser(()=>{const u=user(),i=u.watch.indexOf(id);if(i<0)u.watch.push(id);else u.watch.splice(i,1);save();rememberScroll();renderRoot();toast(i<0?'已加入自选':'已移除自选');});}
function cancelOrder(id){const o=user().orders.find(x=>x.id===id);if(!o||!active(o))return;ask('撤销剩余委托？',`${stock(o.idStock).name}，尚有 ${o.qty-o.filled} 股未成交。撤单后释放对应冻结，已成交部分保留。`,'确认撤单',()=>{if(active(o)){o.status='CANCELED';save();updateLive();toast('未成交部分已撤销');}else toast('委托已经成交');});}
function patchQuotes(){
 for(const s of STOCKS){for(const [key,value] of [['price',plain(s.price)],['percent',signed(delta(s))+'%'],['delta',signed((s.price-s.prev)/100)],['bid',plain(s.price-1)],['ask',plain(s.price+1)]])document.querySelectorAll(`[data-${key}="${s.id}"]`).forEach(el=>{el.textContent=value;if(key==='percent'||key==='delta'){el.classList.toggle('up',s.price>=s.prev);el.classList.toggle('down',s.price<s.prev);}});}
 const up=STOCKS.filter(s=>s.price>=s.prev).length;
 document.querySelectorAll('[data-breadth-up]').forEach(el=>el.textContent=up);document.querySelectorAll('[data-breadth-down]').forEach(el=>el.textContent=STOCKS.length-up);document.querySelectorAll('[data-breadth-bar]').forEach(el=>el.style.flex=el.dataset.breadthBar==='up'?up:STOCKS.length-up);
}
function updateHoldings(u){const container=document.getElementById('holdings');if(!container)return;const ids=Object.keys(u.positions);container.querySelectorAll('[data-holding]').forEach(el=>{if(!ids.includes(el.dataset.holding))el.remove();});for(const id of ids){const p=u.positions[id];let row=container.querySelector(`[data-holding="${id}"]`);if(!row){container.insertAdjacentHTML('beforeend',holdingHTML(id,p));row=container.lastElementChild;}const pnl=stock(id).price*p.qty-p.cost;row.querySelector('[data-holding-field="value"]').textContent=money(stock(id).price*p.qty);row.querySelector('[data-holding-field="qty"]').textContent=p.qty+' / '+sellable(u,id);const el=row.querySelector('[data-holding-field="pnl"]');el.textContent=signed(pnl/100);el.classList.toggle('up',pnl>=0);el.classList.toggle('down',pnl<0);}
 document.getElementById('holdings-empty').hidden=Boolean(ids.length);document.querySelectorAll('[data-position-count]').forEach(el=>el.textContent=ids.length+' 只');
}
function updateOrders(u){
 document.querySelectorAll('[data-order-row]').forEach(row=>{const o=u.orders.find(x=>x.id===row.dataset.orderRow);if(!o)return;for(const [key,value] of [['status',orderStatus(o)],['filled',o.filled],['average',averageLabel(o)],['fee',money(o.fee)+' HKD']])row.querySelectorAll(`[data-order-field="${key}"]`).forEach(el=>{el.textContent=value;if(key==='status')el.classList.toggle('terminal',!active(o));});row.querySelectorAll('[data-order-field="progress"]').forEach(el=>el.style.width=o.filled/o.qty*100+'%');if(current().page==='orders'&&(current().view||'orders')==='orders')row.hidden=(current().filter||'active')==='active'&&!active(o);});
 document.querySelectorAll('[data-cancel-area]').forEach(el=>{const o=u.orders.find(x=>x.id===el.dataset.cancelArea);el.hidden=!o||!active(o);});document.querySelectorAll('[data-cancel-button]').forEach(el=>{const o=u.orders.find(x=>x.id===el.dataset.cancelButton);if(o){el.textContent='撤销剩余 '+(o.qty-o.filled)+' 股';el.disabled=!active(o);}});
 document.querySelectorAll('[data-order-explanation]').forEach(el=>{const o=u.orders.find(x=>x.id===el.dataset.orderExplanation);el.textContent=!o?'':o.status==='FILLED'?'委托已全部成交，资金与持仓已更新。':o.status==='CANCELED'?'未成交部分已撤销，冻结已释放。':'达到限价条件后逐手成交。未成交部分可撤销。';});
 const emptyEl=document.getElementById('orders-empty');if(emptyEl)emptyEl.hidden=u.orders.some(o=>(current().filter||'active')==='all'||active(o));
 const tradeList=document.getElementById('trade-list');if(tradeList&&tradeList.childElementCount!==u.trades.length){tradeList.insertAdjacentHTML('afterbegin',u.trades.slice(tradeList.childElementCount).reverse().map(tradeRecord).join(''));document.getElementById('trades-empty').hidden=Boolean(u.trades.length);}
}
function updateLive(){patchQuotes();const u=user();if(!u)return;const a={...account(u),cash:u.cash};document.querySelectorAll('[data-money]').forEach(el=>{const value=a[el.dataset.money];if(el.dataset.masked==='true')el.textContent='••••••';else{const sign=el.dataset.signed==='true';el.textContent=sign?signed(value/100):money(value);if(sign){el.classList.toggle('up',value>=0);el.classList.toggle('down',value<0);}}});const count=u.orders.filter(active).length;document.querySelectorAll('[data-open-orders]').forEach(el=>el.textContent=count?count+' 笔委托进行中':'委托与成交记录');updateHoldings(u);updateOrders(u);if(task?.stage==='edit'){const el=document.getElementById('trade-available');if(el)el.textContent=task.side==='BUY'?money(a.available)+' HKD':sellable(u,task.id)+' 股';}}
function clearTradeErrors(){for(const id of ['price','quantity']){const el=document.getElementById(id+'-error');if(el)el.textContent='';}taskLayer.querySelectorAll('[aria-invalid]').forEach(el=>el.removeAttribute('aria-invalid'));}
function onAction(event){const button=event.target.closest('[data-action]');if(!button||button.disabled)return;const action=button.dataset.action,value=button.dataset.value,id=button.dataset.id,r=current();switch(action){
 case 'tab':selectTab(button.dataset.tab);break;
 case 'back':back();break;
 case 'search':push({page:'search',query:''});break;
 case 'detail':push({page:'detail',id});break;
 case 'browse':push({page:'browse'});break;
 case 'rank':rememberScroll();r.rank=value;writeHistory();renderRoot();break;
 case 'sort':rememberScroll();r.sort=value;writeHistory();renderRoot();break;
 case 'manage':requireUser(()=>push({page:'manage',list:[...user().watch]}));break;
 case 'remove-watch':rememberScroll();r.list=r.list.filter(x=>x!==id);renderRoot();break;
 case 'move-watch':{rememberScroll();const i=Number(button.dataset.index),j=i+Number(button.dataset.step);[r.list[i],r.list[j]]=[r.list[j],r.list[i]];renderRoot();break;}
 case 'save-watch':user().watch=[...r.list];save();back();toast('自选已保存');break;
 case 'toggle-watch':toggleWatch(id);break;
 case 'period':r.period=value;delete r.cross;document.getElementById('chart-area').innerHTML=chartArea(r);break;
 case 'fund-range':r.fundRange=value;document.getElementById('fund-body').innerHTML=fundBody(r);{const net=fundNet(r),el=document.getElementById('fund-net');el.textContent='净流入 '+signed(net/1000000)+' 万';el.classList.toggle('up',net>=0);el.classList.toggle('down',net<0);}break;
 case 'trade':beginTrade(id);break;
 case 'sell':beginTrade(id,'SELL');break;
 case 'balance':rememberScroll();r.hidden=!r.hidden;renderRoot();break;
 case 'orders':push({page:'orders',view:'orders',filter:'active'});break;
 case 'order':viewOrder(button.dataset.order);break;
 case 'order-view':rememberScroll();r.view=value;r.scroll=0;writeHistory();renderRoot();break;
 case 'order-filter':r.filter=value;writeHistory();updateOrders(user());button.parentElement.querySelectorAll('button').forEach(el=>{el.classList.toggle('selected',el===button);el.setAttribute('aria-pressed',String(el===button));});break;
 case 'cancel-order':cancelOrder(button.dataset.order);break;
 case 'settings':push({page:'settings'});break;
 case 'rules':push({page:'rules'});break;
 case 'go-watch':selectTab('watch');break;
 case 'logout':logout();break;
 case 'login':afterAuth=null;present({type:'auth',mode:'login'});break;
 case 'demo':if(task?.type==='auth')login('demo@harbor.app');else{db.active='demo@harbor.app';save();renderRoot();toast('已登录演示账户');}break;
 case 'close-task':if(task?.type==='auth')afterAuth=null;closeTask();break;
 case 'task-back':goBack();break;
 case 'side':drafts.set(task.id+':'+task.side,{price:task.price,qty:task.qty});task.side=value;{const draft=drafts.get(task.id+':'+value);task.price=draft?.price||plain(stock(task.id).price+(value==='BUY'?1:-1));task.qty=draft?.qty||'100';}renderTask();break;
 case 'opponent':task.price=plain(stock(task.id).price+(task.side==='BUY'?1:-1));document.getElementById('limit-price').value=task.price;clearTradeErrors();updateEstimate();break;
 case 'quantity':task.qty=value;document.getElementById('quantity').value=value;clearTradeErrors();updateEstimate();break;
 case 'max-quantity':{const p=Math.round(Number(task.price)*100);if(!p||p<100){toast('请先填写有效价格');break;}let q=task.side==='SELL'?sellable(user(),task.id):Math.min(100000,Math.floor(account(user()).available/p/100)*100);while(q>0&&task.side==='BUY'&&q*p+fee(q*p)>account(user()).available)q-=100;task.qty=String(Math.min(100000,q));document.getElementById('quantity').value=task.qty;clearTradeErrors();updateEstimate();break;}
 case 'submit-order':submitOrder();break;
 case 'view-order':viewOrder(button.dataset.order);break;
 case 'auth-mode':task.mode=task.mode==='register'?'login':'register';renderTask();break;
 case 'password':{const input=document.getElementById('auth-password');input.type=input.type==='password'?'text':'password';button.textContent=input.type==='password'?'显示':'隐藏';button.setAttribute('aria-label',button.textContent+'密码');break;}
}}
document.getElementById('app').addEventListener('click',onAction);
document.getElementById('app').addEventListener('input',event=>{const input=event.target;if(input.id==='search-input'){current().query=input.value;document.getElementById('search-results').innerHTML=searchResults(input.value);}else if(input.classList.contains('chart-range')){current().cross=Number(input.value);document.getElementById('chart-graphic').innerHTML=chartSVG(current());document.getElementById('chart-readout').innerHTML=chartReadout(current());}else if(input.closest('#trade-form')){task[input.name==='price'?'price':'qty']=input.value;clearTradeErrors();updateEstimate();}else if(input.closest('#auth-form')){task[input.name]=input.value;input.removeAttribute('aria-invalid');document.getElementById('auth-error').textContent='';}});
workspace.addEventListener('toggle',event=>{if(event.target.dataset.detail)current()[{funds:'fundsOpen',quote:'quoteOpen',analysis:'analysisOpen'}[event.target.dataset.detail]]=event.target.open;},true);
document.getElementById('app').addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='trade-form')previewTrade();else if(event.target.id==='auth-form'){const email=(task.email||'').trim().toLowerCase(),password=task.password||'',name=(task.name||'').trim();let error='';if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))error='请输入有效的模拟邮箱';else if(password.length<8||password.length>128)error='密码长度须为 8–128 位';else if(task.mode==='register'){if(db.users[email])error='该邮箱已经注册，请直接登录';else{db.users[email]=newUser((name||email.split('@')[0]).slice(0,24),email,password);login(email);}}else if(db.users[email]?.password!==password)error='邮箱或密码不正确，请重新输入';else login(email);if(error){const message=document.getElementById('auth-error');message.textContent=error;const input=document.getElementById(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)?'auth-email':'auth-password');input.setAttribute('aria-invalid','true');input.setAttribute('aria-describedby','auth-error');input.focus();}}});
document.addEventListener('keydown',event=>{if(!task||document.getElementById('confirm-dialog').open)return;if(event.key==='Escape'){event.preventDefault();if(task.type==='auth')afterAuth=null;closeTask();}else if(event.key==='Tab'){const items=[...taskLayer.querySelectorAll('button:not(:disabled),input:not(:disabled),summary,[href]')].filter(el=>el.getClientRects().length&&!el.hidden),first=items[0],last=items.at(-1);if(event.shiftKey&&(document.activeElement===first||document.activeElement===document.getElementById('task-title'))){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}});
setInterval(()=>{updateCountdown();if(document.hidden)return;tick++;if(tick%2===0)STOCKS.forEach((s,i)=>s.price+=((tick/2+i)%3)-1);settle();updateLive();},1500);
writeHistory();renderRoot();
</script>
</body>
