<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<title>Harbor 海港 · 股票</title>
<style>
/* ---------- Tokens：语义见 docs/design.md ---------- */
:root {
 color-scheme:light;
 --bg:#f6f6f3; --sunk:#ececE8; --raised:#ffffff; --pill-on:#ffffff;
 --ink:#1c1e22; --ink2:#6a6d74; --ink3:#9b9da3;
 --accent:#3f6a9e; --accent-soft:#3f6a9e1c; --on-accent:#ffffff; --on-tone:#ffffff;
 --red:#c2554b; --green:#2e8667; --warn:#a9792f;
 --glass:#f3f3f0c4; --scrim:#1c1e2233; --outside:#e6e6e2;
 --shadow:0 1px 2px #1c1e2208,0 8px 24px #1c1e220c;
 --hairline:transparent;
 --rise:var(--red); --fall:var(--green);
 --spring:cubic-bezier(.32,1.32,.52,1); --ease:cubic-bezier(.2,.7,.2,1);
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
 font-synthesis:none; -webkit-font-smoothing:antialiased;
}
@media (prefers-color-scheme:dark) {
 :root:not([data-theme="light"]) {
  color-scheme:dark;
  --bg:#111214; --sunk:#1c1d20; --raised:#26272a; --pill-on:#3a3c41;
  --ink:#ececee; --ink2:#a0a2a8; --ink3:#6e7076;
  --accent:#8db0da; --accent-soft:#8db0da22; --on-accent:#111214; --on-tone:#111214;
  --red:#e07e73; --green:#5dba97; --warn:#d5a55e;
  --glass:#1c1d20c4; --scrim:#00000080; --outside:#060607;
  --shadow:none; --hairline:#ffffff10;
 }
}
:root[data-theme="dark"] {
 color-scheme:dark;
 --bg:#111214; --sunk:#1c1d20; --raised:#26272a; --pill-on:#3a3c41;
 --ink:#ececee; --ink2:#a0a2a8; --ink3:#6e7076;
 --accent:#8db0da; --accent-soft:#8db0da22; --on-accent:#111214; --on-tone:#111214;
 --red:#e07e73; --green:#5dba97; --warn:#d5a55e;
 --glass:#1c1d20c4; --scrim:#00000080; --outside:#060607;
 --shadow:none; --hairline:#ffffff10;
}
:root[data-colors="green-up"] {--rise:var(--green); --fall:var(--red)}

/* ---------- 基础 ---------- */
* {box-sizing:border-box} [hidden] {display:none!important}
body {margin:0;background:var(--outside);color:var(--ink)}
button,input {font:inherit;color:inherit} button {border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled {opacity:.38;cursor:default}
:focus-visible {outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
h1,h2,h3,p,ol {margin:0} ol {padding:0;list-style:none} svg {display:block} button svg {pointer-events:none}
.number {font-variant-numeric:tabular-nums;font-feature-settings:"tnum";letter-spacing:-.2px}
.rise {color:var(--rise)} .fall {color:var(--fall)} .ink2 {color:var(--ink2)} .ink3 {color:var(--ink3)}

/* ---------- 手机预览外壳 ---------- */
.preview {min-height:100dvh;display:grid;place-items:center;padding:44px 20px 28px}
.preview-label {position:absolute;top:15px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:1.6px;color:var(--ink3)}
.phone {width:402px;height:min(874px,calc(100dvh - 72px));min-height:520px;position:relative;display:flex;flex-direction:column;overflow:hidden;border-radius:48px;background:var(--bg);box-shadow:0 0 0 7px var(--raised),0 0 0 8px var(--hairline),0 24px 70px #0000001f}
.statusbar {height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0;font-size:13px;font-weight:600;user-select:none}
.status-icons {display:flex;align-items:center;gap:5px}.battery {border:1px solid currentColor;width:22px;height:11px;border-radius:3px;padding:1px;opacity:.9}.battery:after {content:"";display:block;width:80%;height:100%;background:currentColor;border-radius:1px}
#app {display:flex;flex:1;min-height:0;position:relative;flex-direction:column;overflow:hidden}
#workspace {display:flex;flex:1;min-height:0;flex-direction:column}

/* ---------- 页面结构 ---------- */
.top {padding:8px 20px 4px;flex:none}
.top-row {display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px}
.top h1 {font-size:28px;font-weight:700;letter-spacing:-.6px;outline:none}
.top .sub {font-size:13px;color:var(--ink2);margin-top:2px;display:flex;align-items:center;gap:6px}
.actions {display:flex;gap:2px}
.ibtn {width:40px;height:40px;display:grid;place-items:center;border-radius:50%;flex:none;color:var(--ink);transition:background .2s}
.ibtn:active {background:var(--sunk)} .ibtn svg {width:21px;height:21px}
.ibtn.sm {width:30px;height:30px}.ibtn.sm svg {width:15px;height:15px;color:var(--ink3)}
.avatar-btn {width:36px;height:36px;border-radius:50%;background:var(--sunk);color:var(--ink2);font-size:14px;font-weight:600}
.pnav {display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;padding:4px 10px;min-height:52px;flex:none}
.pnav .title {text-align:center;min-width:0}
.pnav h1 {font-size:16px;font-weight:600;outline:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnav small {display:block;font-size:11px;color:var(--ink3);margin-top:2px}
.pnav .end {justify-self:end}
.screen {flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:4px 20px 112px;scrollbar-width:none}
.screen::-webkit-scrollbar {display:none}
.sec {display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 6px}
.sec h2 {font-size:15px;font-weight:650;letter-spacing:-.2px}
.sec>span,.sec>button {font-size:12px;color:var(--ink3)}
.col-head {display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);padding:8px 0 2px}
.note {font-size:12px;color:var(--ink3);line-height:1.7;margin-top:14px}
.link {color:var(--accent);font-size:13px;font-weight:550;min-height:36px;padding:0 2px}
.empty-line {padding:22px 0 6px;color:var(--ink2);font-size:13px;line-height:1.8}

/* ---------- 行：平铺，靠留白分开 ---------- */
.srow {display:grid;grid-template-columns:minmax(0,1fr) 56px 96px;gap:12px;align-items:center;width:calc(100% + 20px);margin:0 -10px;padding:12px 10px;text-align:left;border-radius:14px;transition:background .2s}
.srow:active,.orow:active,.hmain:active,.link-row:active {background:var(--sunk)}
.srow.nospark {grid-template-columns:minmax(0,1fr) 96px}
.srow.rank {grid-template-columns:22px minmax(0,1fr) 96px}
.rank-no {font-size:12px;color:var(--ink3);align-self:start;padding-top:3px}
.name {font-size:16px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta {font-size:12px;color:var(--ink3);margin-top:4px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.held {color:var(--accent);font-weight:600}
.val {text-align:right;min-width:0}.val strong {display:block;font-size:17px;font-weight:600}.val .chg {display:block;font-size:13px;margin-top:4px;font-weight:500}
.spark {width:56px;height:26px}.spark polyline {fill:none;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round;opacity:.75}
.spark .rise {stroke:var(--rise)}.spark .fall {stroke:var(--fall)}
.tick {animation:tick .9s var(--ease)} @keyframes tick {from {background:var(--accent-soft)} to {background:transparent}}
[data-price] {border-radius:5px;padding:0 2px;margin:0 -2px}
.hero [data-price] {padding:0;margin:0}.hero .tick {animation:none}
.add-line {display:flex;align-items:center;gap:8px;color:var(--accent);font-size:14px;font-weight:550;min-height:48px;margin-top:6px}.add-line svg {width:17px;height:17px}
.link-row {display:flex;align-items:center;justify-content:space-between;width:calc(100% + 20px);margin:22px -10px 0;padding:14px 10px;border-radius:14px;font-size:15px;text-align:left}
.link-row .end {display:flex;align-items:center;gap:4px;color:var(--ink3);font-size:13px}.link-row svg {width:15px;height:15px}

/* ---------- 卡片：只给需要处理和可以拿走的 ---------- */
.card {background:var(--raised);border-radius:20px;box-shadow:var(--shadow),inset 0 0 0 1px var(--hairline);padding:16px 18px;margin-top:12px}
.card.in {animation:card-in .45s var(--spring)} @keyframes card-in {from {transform:translateY(8px) scale(.98);opacity:0}}
.pill-btn {min-height:34px;padding:0 14px;border-radius:999px;background:var(--sunk);font-size:13px;font-weight:600;white-space:nowrap}
.pill-btn.on-card {background:var(--sunk)}
.oc-top {display:flex;align-items:center;gap:8px;font-size:13px}
.side {font-weight:650}.oc-name {font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oc-status {margin-left:auto;color:var(--warn);font-weight:550;white-space:nowrap}
.oc-main {font-size:20px;font-weight:600;margin-top:8px}.oc-main small {font-size:12px;color:var(--ink3);font-weight:500}
.bar {height:4px;border-radius:2px;background:var(--sunk);margin-top:14px;overflow:hidden;position:relative}
.bar i {display:block;height:100%;border-radius:2px;background:var(--accent);transition:width .5s var(--ease)}
.bar.live:after {content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--accent-soft),transparent);animation:sweep 1.8s linear infinite} @keyframes sweep {from {transform:translateX(-100%)} to {transform:translateX(100%)}}
.oc-foot {display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:12px;color:var(--ink2)}
.oc-actions {display:flex;align-items:center;gap:6px}
.receipt {display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:start}
.rc-icon {width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}.rc-icon svg {width:17px;height:17px}
.rc-icon.muted {background:var(--sunk);color:var(--ink2)}
.receipt b {font-size:15px;font-weight:600;display:block;margin-top:1px}.receipt p {font-size:12px;color:var(--ink2);margin-top:4px;line-height:1.6}
.receipt .link {margin:4px 0 -8px -2px;min-height:32px}

/* ---------- 控件 ---------- */
.seg {display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px}
.seg button {flex:1;min-height:34px;border-radius:9px;font-size:13px;color:var(--ink2);white-space:nowrap;transition:background .2s,color .2s}
.seg button.on {background:var(--raised);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.seg.side-seg button.on.buy {color:var(--rise)}.seg.side-seg button.on.sell {color:var(--fall)}
.tabs {display:flex;gap:4px}.tabs button {min-height:32px;padding:0 12px;border-radius:999px;font-size:13px;color:var(--ink2)}
.tabs button.on {background:var(--sunk);color:var(--ink);font-weight:600}
.chips {display:flex;gap:6px;flex-wrap:wrap}.chips button {min-height:32px;padding:0 12px;border-radius:999px;background:var(--sunk);font-size:12px;color:var(--ink2)}
.chips button.on {background:var(--accent-soft);color:var(--accent);font-weight:600}
.primary {display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:600;transition:transform .2s var(--spring),filter .2s}
.primary:active {transform:scale(.98)} .primary.buy {background:var(--rise);color:var(--on-tone)} .primary.sell {background:var(--fall);color:var(--on-tone)}
.secondary-btn {display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border-radius:999px;background:var(--sunk);font-size:15px;font-weight:600}
.star.on {color:var(--accent)} .pop {animation:pop .45s var(--spring)} @keyframes pop {40% {transform:scale(1.28)}}

/* ---------- 一级导航：纯图标浮动胶囊 ---------- */
#dock {position:absolute;left:0;right:0;bottom:18px;height:56px;z-index:20;pointer-events:none}
.navpill {position:absolute;top:0;left:calc(50% - 92px);width:184px;height:56px;padding:6px;display:flex;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);box-shadow:var(--shadow),inset 0 0 0 1px var(--hairline);pointer-events:auto;transition:left .5s var(--spring)}
#dock.has-action .navpill {left:20px}
.navind {position:absolute;top:6px;left:6px;width:57px;height:44px;border-radius:999px;background:var(--pill-on);box-shadow:var(--shadow);transition:transform .5s var(--spring)}
.navbtn {position:relative;z-index:1;flex:1;display:grid;place-items:center;border-radius:999px;color:var(--ink2);transition:color .25s}
.navbtn svg {width:23px;height:23px}.navbtn.on {color:var(--accent)}
.dock-action {position:absolute;top:0;right:20px;height:56px;max-width:calc(100% - 228px);padding:0 24px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateX(30px) scale(.92);transition:opacity .25s,transform .5s var(--spring);box-shadow:var(--shadow)}
.dock-action.neutral {background:var(--glass);color:var(--rise);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);box-shadow:var(--shadow),inset 0 0 0 1px var(--hairline)}
#dock.has-action .dock-action {opacity:1;transform:none;pointer-events:auto}

/* ---------- 自选管理：拖拽重排 ---------- */
.mrow {display:flex;align-items:center;gap:6px;min-height:64px;background:var(--bg);border-radius:14px;position:relative;transition:transform .28s var(--spring),box-shadow .2s}
.mrow .info {flex:1;min-width:0}
.mrow.lifted {z-index:2;transition:box-shadow .2s;box-shadow:0 10px 30px #00000022;background:var(--raised)}
.remove {color:var(--rise)} .grip {cursor:grab;touch-action:none;color:var(--ink3)} .grip:active {cursor:grabbing}

/* ---------- 市场 ---------- */
.dot {width:6px;height:6px;border-radius:50%;background:var(--fall);display:inline-block}
.idx-main {display:flex;justify-content:space-between;align-items:flex-end;padding-top:10px}
.idx-label {font-size:13px;color:var(--ink2)}
.idx-value {font-size:34px;font-weight:600;letter-spacing:-1px;margin-top:4px}
.idx-change {font-size:14px;margin-top:4px;font-weight:500}
.idx-spark {width:110px;height:48px}
.idx-sub {display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
.idx-sub strong {display:block;font-size:17px;font-weight:600;margin:4px 0 2px}.idx-sub .chg {font-size:12px}
.breadth {margin-top:24px}.breadth-labels {display:flex;justify-content:space-between;font-size:12px;color:var(--ink2)}
.breadth-bar {display:flex;gap:3px;height:4px;margin-top:8px}.breadth-bar i {border-radius:2px;transition:flex .5s var(--ease)}
.breadth-bar i:first-child {background:var(--rise);opacity:.55}.breadth-bar i:last-child {background:var(--fall);opacity:.55}

/* ---------- 搜索 ---------- */
.search-top {display:flex;gap:8px;align-items:center;padding:8px 20px 8px;flex:none}
.search-field {flex:1;display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:12px;padding:0 12px;min-height:42px}
.search-field svg {width:17px;height:17px;color:var(--ink3)}
.search-field input {flex:1;min-width:0;border:0;outline:0;background:none;height:42px;font-size:16px}
.search-field:focus-within {box-shadow:0 0 0 2px var(--accent-soft)}
.sresult {display:flex;align-items:center;gap:4px}.sresult .srow {flex:1;width:auto;margin-right:0}

/* ---------- 个股详情 ---------- */
.hero {padding:4px 0 0}
.hero .price {font-size:42px;font-weight:600;letter-spacing:-1.4px;line-height:1.1}
.hero .move {display:flex;gap:12px;font-size:15px;font-weight:550;margin-top:6px}
.stamp {font-size:11px;color:var(--ink3);margin-top:8px}
.mine {display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--sunk);border-radius:16px;padding:12px 12px 12px 16px;margin-top:18px}
.mine-main {font-size:14px}.mine-main b {font-weight:600}.mine-sub {font-size:12px;color:var(--ink2);margin-top:4px}
.mine .pill-btn {background:var(--raised);box-shadow:var(--shadow);color:var(--fall)}
.chart-head {display:flex;align-items:center;justify-content:space-between;margin-top:26px}
.readout {font-size:12px;color:var(--ink2);min-height:38px;display:flex;align-items:center;justify-content:space-between;gap:8px;line-height:1.6;margin-top:8px}
.readout strong {color:var(--ink);font-weight:550}
.readout .link {font-size:12px;min-height:28px}
#chart-graphic {touch-action:pan-y;cursor:crosshair;border-radius:8px;user-select:none;-webkit-user-select:none}
.chart-svg {width:100%;height:auto}
.chart-svg .g {stroke:var(--sunk)}.chart-svg .ax {fill:var(--ink3);font-size:8px}
.chart-svg .rise {fill:var(--rise);stroke:var(--rise)}.chart-svg .fall {fill:var(--fall);stroke:var(--fall)}
.chart-svg .vol {opacity:.32}.chart-svg .area {fill:var(--accent);opacity:.08}.chart-svg .ln {stroke:var(--accent);fill:none;stroke-width:1.6}
.chart-svg .xh {stroke:var(--ink3);stroke-dasharray:3 3}.chart-svg .xd {fill:var(--accent)}
.stats {display:grid;grid-template-columns:repeat(3,1fr);gap:16px 12px;margin-top:22px}
.stats span {display:block;font-size:11px;color:var(--ink3)}.stats b {display:block;font-size:15px;font-weight:550;margin-top:4px}
.book {display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.book span {display:block;font-size:11px;color:var(--ink3)}.book b {display:block;font-size:17px;font-weight:600;margin-top:4px}
.book>div:last-child {text-align:right}
.fold summary {list-style:none;cursor:pointer;display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 6px;min-height:28px}
.fold summary::-webkit-details-marker {display:none}
.fold summary h2 {font-size:15px;font-weight:650;display:flex;align-items:center;gap:6px}
.fold summary h2 svg {width:14px;height:14px;color:var(--ink3);transition:transform .3s var(--spring)}
.fold[open] summary h2 svg {transform:rotate(90deg)}
.fold summary>span {font-size:13px;font-weight:550}
.fund-row {display:grid;grid-template-columns:36px 1fr 78px;gap:12px;align-items:center;font-size:12px;padding:10px 0}
.fund-row>span:last-child {text-align:right}
.fund-track {height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}.fund-track i {display:block;height:100%;border-radius:3px;opacity:.6;transition:width .5s var(--ease)}
.fund-track i.rise {background:var(--rise)}.fund-track i.fall {background:var(--fall)}
.fold .seg {margin:8px 0 6px}

/* ---------- 账户 ---------- */
.assets {padding-top:14px}
.a-label {display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink2)}
.a-label .ibtn {width:30px;height:30px}.a-label .ibtn svg {width:17px;height:17px;color:var(--ink3)}
.a-total {font-size:38px;font-weight:600;letter-spacing:-1.2px;margin-top:2px}
.a-pnl {display:flex;gap:18px;font-size:13px;color:var(--ink2);margin-top:8px}.a-pnl b {font-weight:550;margin-left:4px}
.a-grid {display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px;padding:14px 16px;background:var(--sunk);border-radius:16px}
.a-grid>div>span {display:block;font-size:11px;color:var(--ink3)}.a-grid b {display:block;font-size:15px;font-weight:600;margin-top:4px}
.hrow {display:flex;align-items:center;gap:10px}
.hmain {flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;margin-left:-10px;padding:12px 10px;border-radius:14px;text-align:left}
.hrow .pill-btn {color:var(--fall)}
.welcome {padding:30px 0 0}.welcome h2 {font-size:26px;line-height:1.45;letter-spacing:-.6px}
.welcome p {font-size:14px;line-height:1.85;color:var(--ink2);margin:14px 0 30px}
.welcome .secondary-btn {margin-top:10px}.welcome .note {margin-top:20px}

/* ---------- 订单 ---------- */
.filters {display:flex;gap:6px;margin:16px 0 4px}
.orow {display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;width:calc(100% + 20px);margin:0 -10px;padding:12px 10px;border-radius:14px;text-align:left}
.orow .name {font-size:15px}.orow .side {margin-right:6px;font-size:13px}
.status {font-size:13px;font-weight:550;color:var(--warn);display:block}.status.terminal {color:var(--ink2);font-weight:500}
.ohero {padding:10px 0 0}.ohero h2 {font-size:24px;letter-spacing:-.5px;margin-top:6px}.ohero p {font-size:13px;color:var(--ink2);margin-top:6px}
.bar-label {display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-top:8px}
.kvs {margin-top:24px}
.kv {display:flex;align-items:baseline;justify-content:space-between;gap:20px;font-size:14px;padding:9px 0;line-height:1.5}
.kv>span:first-child {color:var(--ink2);flex:none}.kv>span:last-child {text-align:right;overflow-wrap:anywhere}

/* ---------- 设置 ---------- */

.sheet.enter {animation:sheet-in .5s var(--spring)} @keyframes sheet-in {from {transform:translateY(100%)}}
.grabber {width:36px;height:5px;border-radius:3px;background:var(--ink3);opacity:.4;margin:8px auto 0;flex:none}
.sheet-nav {display:grid;grid-template-columns:72px 1fr 72px;align-items:center;padding:4px 12px 6px;min-height:52px;flex:none}

.sheet-nav .end {justify-self:end}.sheet-nav .ibtn {background:var(--sunk);width:32px;height:32px}.sheet-nav .ibtn svg {width:15px;height:15px;color:var(--ink2)}
.back-text {display:flex;align-items:center;gap:2px;color:var(--accent);font-size:15px;min-height:40px}.back-text svg {width:18px;height:18px}

.input:focus-within {box-shadow:inset 0 0 0 1.5px var(--accent)}

.input input {flex:1;min-width:0;border:0;outline:0;background:none;height:56px;font-size:24px;font-weight:600;text-align:center;letter-spacing:-.4px}

.step-btn:active {background:var(--raised)}.step-btn svg {width:18px;height:18px}

.confirm-card h3 .side {font-size:14px}
.confirm-card>p {font-size:12px;color:var(--ink3);margin:4px 0 10px}
.countdown {display:flex;align-items:center;gap:12px;margin-top:20px;font-size:13px;color:var(--ink2)}
.ring {width:40px;height:40px;position:relative;flex:none}
.ring svg {width:40px;height:40px;transform:rotate(-90deg)}
.ring circle {fill:none;stroke-width:3}.ring .track {stroke:var(--sunk)}
.ring .left {stroke:var(--warn);stroke-linecap:round;stroke-dasharray:107;animation:drain linear forwards} @keyframes drain {to {stroke-dashoffset:107}}
.ring b {position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--warn)}
.countdown.expired .ring b {color:var(--rise)} .countdown.expired {color:var(--rise)}
.result-card {text-align:left}
.result-card .rc-icon {width:44px;height:44px;margin-bottom:14px}.result-card .rc-icon svg {width:22px;height:22px}

/* ---------- 浮层反馈 ---------- */
.toast {position:absolute;z-index:50;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;width:max-content;max-width:calc(100% - 40px);font-size:13px;text-align:center;pointer-events:none;animation:card-in .4s var(--spring)}
dialog {border:0;border-radius:24px;padding:24px;width:min(320px,calc(100vw - 40px));color:var(--ink);background:var(--raised);box-shadow:0 20px 60px #00000033}
dialog::backdrop {background:var(--scrim)}
dialog h2 {font-size:18px}dialog p {font-size:14px;color:var(--ink2);line-height:1.75;margin:10px 0 22px}
.dialog-actions {display:flex;gap:8px}.dialog-actions button {flex:1;min-height:46px;border-radius:999px;font-size:15px;font-weight:600}
#dialog-cancel {background:var(--sunk)}#dialog-accept {background:var(--rise);color:#fff}

.screen.enter {animation:page-in .35s var(--ease)} @keyframes page-in {from {transform:translateX(14px);opacity:.4}}

@media (max-width:540px) {
 body {background:var(--bg)}.preview {padding:0;display:block;min-height:100dvh}.preview-label {display:none}
 .phone {width:100%;height:100dvh;min-height:0;border-radius:0;box-shadow:none}
 .statusbar {height:calc(28px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top)}
 #dock {bottom:max(14px,env(safe-area-inset-bottom))}.sheet-foot {padding-bottom:max(20px,env(safe-area-inset-bottom))}
}
@media (max-width:350px) {
 .top,.screen,.search-top,.sheet-body,.sheet-foot {padding-left:16px;padding-right:16px}
 .srow {grid-template-columns:minmax(0,1fr) 84px}.srow .spark {display:none}.srow.rank {grid-template-columns:20px minmax(0,1fr) 84px}
 .val strong {font-size:16px}.name {font-size:15px}.hero .price {font-size:36px}
 .navpill {width:168px;left:calc(50% - 84px)}.navind {width:52px}#dock.has-action .navpill {left:16px}
 .dock-action {right:16px;max-width:calc(100% - 200px);padding:0 16px;font-size:15px}
 .a-total {font-size:32px}.a-grid {padding:12px}.a-grid b {font-size:14px}
}
@media (prefers-reduced-motion:reduce) {
 *,*:before,*:after {animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>

 <p class="preview-label">HARBOR · 移动预览</p>
 <div class="phone">
  <div class="statusbar" aria-hidden="true"><span>9:41</span><div class="status-icons"><svg width="17" height="11" viewBox="0 0 16 11" fill="currentColor"><rect y="7" width="3" height="4" rx=".7"/><rect x="4" y="5" width="3" height="6" rx=".7"/><rect x="8" y="2" width="3" height="9" rx=".7"/><rect x="12" width="3" height="11" rx=".7"/></svg><svg width="15" height="12" viewBox="0 0 16 14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M1 4a11 11 0 0 1 14 0M4 7a6 6 0 0 1 8 0M7 10a2 2 0 0 1 2 0"/><circle cx="8" cy="12.5" r=".6" fill="currentColor" stroke="none"/></svg><span class="battery"></span></div></div>

<script>
'use strict';
/* ================= 样例数据与偏好 ================= */
const STOCKS = [
 {id:'00700',name:'腾讯控股',en:'TENCENT',sector:'互联网',price:42860,prev:42020},
 {id:'09988',name:'阿里巴巴-W',en:'BABA-W',sector:'互联网',price:16610,prev:16250},
 {id:'01810',name:'小米集团-W',en:'XIAOMI-W',sector:'科技',price:3842,prev:3896},
 {id:'03690',name:'美团-W',en:'MEITUAN-W',sector:'互联网',price:10250,prev:10110},
 {id:'00388',name:'香港交易所',en:'HKEX',sector:'金融',price:39720,prev:39960},
 {id:'09618',name:'京东集团-SW',en:'JD-SW',sector:'互联网',price:12240,prev:11980},
 {id:'09999',name:'网易-S',en:'NETEASE-S',sector:'互联网',price:18380,prev:18160},
 {id:'00883',name:'中国海洋石油',en:'CNOOC',sector:'能源',price:2354,prev:2376}
];
const PREF_KEY='harbor-prefs-v1';
const prefs={theme:'system',colors:'red-up'};
try{Object.assign(prefs,JSON.parse(localStorage.getItem(PREF_KEY))||{});}catch{}
function applyPrefs(){const root=document.documentElement;if(prefs.theme==='system')delete root.dataset.theme;else root.dataset.theme=prefs.theme;root.dataset.colors=prefs.colors;}
function savePrefs(){try{localStorage.setItem(PREF_KEY,JSON.stringify(prefs));}catch{}applyPrefs();}
applyPrefs();

const ICONS={
 search:'<circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.2 4.2"/>',
 back:'<path d="m14.5 5-7 7 7 7"/>',chevron:'<path d="m9 5 7 7-7 7"/>',
 star:'<path d="m12 3.2 2.7 5.5 6 .9-4.4 4.2 1 6-5.3-2.8-5.3 2.8 1-6-4.4-4.2 6-.9Z"/>',
 pulse:'<path d="M3 17.5 8.5 11l4 3.5L21 6"/><path d="M16 6h5v5"/>',
 wallet:'<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/><path d="M6 6V5a2 2 0 0 1 2-2h9"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',close:'<path d="m6.5 6.5 11 11M6.5 17.5l11-11"/>',
 check:'<path d="m5 12.5 4.5 4.5L19 7"/>',sliders:'<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
 grip:'<path d="M5 9h14M5 15h14"/>',removeDot:'<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>',
 eye:'<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.7"/>',
 eyeOff:'<path d="M3 3l18 18M10.6 6.1A10 10 0 0 1 12 6c6.5 0 10 6 10 6a17 17 0 0 1-3.2 3.8M6.6 6.6A17 17 0 0 0 2 12s3.5 6 10 6a9.6 9.6 0 0 0 4.4-1"/>',
 sail:'<path d="M11 3v13H3L11 3ZM14 7l6 9h-6V7ZM3 20h18"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/>'
};
const icon=(name,fill=false)=>`<svg viewBox="0 0 24 24" fill="${fill?'currentColor':'none'}" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||''}</svg>`;
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=cents=>(cents/100).toLocaleString('en-HK',{minimumFractionDigits:2,maximumFractionDigits:2});
const plain=cents=>(cents/100).toFixed(2);
const signed=(value,digits=2)=>(value>=0?'+':'')+value.toLocaleString('en-HK',{minimumFractionDigits:digits,maximumFractionDigits:digits});
const stock=id=>STOCKS.find(s=>s.id===id)||STOCKS[0];
const delta=s=>(s.price-s.prev)/s.prev*100;
const tone=value=>value>=0?'rise':'fall';
const defaults=()=>STOCKS.slice(0,6).map(s=>s.id);
const hkTime=(d=new Date())=>new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Hong_Kong',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d);

/* ================= 模拟账本（逻辑沿用已验证版本） ================= */
const STORAGE_KEY='harbor-mobile-prototype-v2';
function newUser(name,email,password,demo=false){return {name,email,password,cash:18268050,watch:defaults(),positions:demo?{'00700':{qty:200,cost:8164800},'09988':{qty:300,cost:4563000},'01810':{qty:1000,cost:3681000}}:{},orders:[],trades:[]};}
function initialDB(){return {version:2,active:null,users:{'demo@harbor.app':newUser('林同学','demo@harbor.app','Harbor2026!',true)}};}
let db=initialDB(),storageAvailable=true;
try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));if(saved?.version===2&&saved.users?.['demo@harbor.app'])db=saved;}catch{storageAvailable=false;}
const user=()=>db.users[db.active]||null;
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db));}catch{storageAvailable=false;}}
const active=o=>o.status==='OPEN'||o.status==='PARTIALLY_FILLED';
const fee=notional=>Math.max(100,Math.ceil(notional*3/10000));
function account(u){const frozen=u.orders.filter(o=>active(o)&&o.side==='BUY').reduce((a,o)=>a+o.reserved-o.spent,0),entries=Object.entries(u.positions),value=entries.reduce((a,[id,p])=>a+p.qty*stock(id).price,0),cost=entries.reduce((a,[,p])=>a+p.cost,0),today=entries.reduce((a,[id,p])=>a+p.qty*(stock(id).price-stock(id).prev),0);return {frozen,available:u.cash-frozen,value,total:u.cash+value,pnl:value-cost,today,cash:u.cash};}
function sellable(u,id){return (u.positions[id]?.qty||0)-u.orders.filter(o=>active(o)&&o.side==='SELL'&&o.idStock===id).reduce((a,o)=>a+o.qty-o.filled,0);}
function settle(){let changed=false;for(const u of Object.values(db.users)){for(const o of u.orders){if(!active(o))continue;const s=stock(o.idStock),price=s.price+(o.side==='BUY'?1:-1);if(o.side==='BUY'?price>o.price:price<o.price)continue;const qty=Math.min(100,o.qty-o.filled),notional=price*qty,newFee=fee(o.notional+notional),extraFee=newFee-o.fee;let p=u.positions[o.idStock];if(o.side==='BUY'){u.cash-=notional+extraFee;o.spent+=notional+extraFee;if(!p)p=u.positions[o.idStock]={qty:0,cost:0};p.qty+=qty;p.cost+=notional+extraFee;}else{const removed=Math.round(p.cost*qty/p.qty);p.qty-=qty;p.cost-=removed;if(!p.qty)delete u.positions[o.idStock];u.cash+=notional-extraFee;}o.filled+=qty;o.notional+=notional;o.fee=newFee;o.status=o.filled===o.qty?'FILLED':'PARTIALLY_FILLED';u.trades.push({orderId:o.id,idStock:o.idStock,side:o.side,price,qty,fee:extraFee,time:hkTime()});changed=true;}}if(changed)save();return changed;}
const averageLabel=o=>o.filled?'均价 '+plain(o.notional/o.filled)+' HKD':active(o)?'等待成交':'无成交';
const orderStatus=o=>({OPEN:'待成交',PARTIALLY_FILLED:'部分成交',FILLED:'已成交',CANCELED:'已撤单'})[o.status]||o.status;
const sideText=o=>o.side==='BUY'?'买入':'卖出';
const sideTone=side=>side==='BUY'?'rise':'fall';
const clone=value=>JSON.parse(JSON.stringify(value));

/* ================= 导航与历史（逻辑沿用已验证版本） ================= */
const PRIVATE_PAGES=['orders','order','manage'];
const TABS=['watch','market','account'],TAB_ICONS={watch:'star',market:'pulse',account:'wallet'},tabNames={watch:'自选',market:'市场',account:'账户'};
let activeTab='watch',stacks={watch:[{page:'watch'}],market:[{page:'market'}],account:[{page:'account'}]},task=null,entry=0;
let afterPop=null,afterAuth=null,returnFocus=null,toastTimer=null,tick=0,historyOK=true;
const drafts=new Map(),workspace=document.getElementById('workspace'),taskLayer=document.getElementById('task-layer'),dock=document.getElementById('dock');
const current=()=>stacks[activeTab].at(-1);
const snapshot=()=>clone({activeTab,stack:stacks[activeTab],task,entry,owner:db.active});
let memoryHistory=[];
function writeHistory(push=false){
 if(push)entry++;
 const state=snapshot(),fragment=task?'task-'+task.type+'-'+(task.stage||'login'):activeTab+'/'+current().page;
 memoryHistory[entry]=state;
 if(historyOK)try{history[push?'pushState':'replaceState'](state,'','#'+fragment);}catch{historyOK=false;}
}
function rememberScroll(){const el=workspace.querySelector('.screen');if(el)current().scroll=el.scrollTop;}
function applyHistory(state){
 const previousTask=task,oldPage=current();
 if(previousTask?.type==='trade'&&previousTask.stage==='edit')drafts.set(previousTask.id+':'+previousTask.side,{price:previousTask.price,qty:previousTask.qty});
 activeTab=state?.activeTab||'watch';stacks[activeTab]=clone(state?.stack||[{page:activeTab}]);task=clone(state?.task||null);entry=state?.entry||0;
 if(state?.owner!==db.active){stacks[activeTab]=stacks[activeTab].filter(r=>!PRIVATE_PAGES.includes(r.page));task=null;}
 if(previousTask?.type==='auth'&&task?.type!=='auth')afterAuth=null;
 if(afterPop){const callback=afterPop;afterPop=null;callback();return;}
 if(oldPage.page!==current().page||oldPage.id!==current().id||previousTask===null&&task===null)renderRoot();
 renderTask();
}
window.addEventListener('popstate',event=>applyHistory(event.state));
function goBack(count=1){if(historyOK)history.go(-count);else applyHistory(memoryHistory[Math.max(0,entry-count)]);}
function push(route){rememberScroll();writeHistory();stacks[activeTab].push(route);writeHistory(true);renderRoot(true);}
function back(){if(stacks[activeTab].length>1)goBack();}
function selectTab(tab){
 if(tab===activeTab){
  if(stacks[tab].length>1&&entry>0)goBack(Math.min(entry,stacks[tab].length-1));
  else workspace.querySelector('.screen')?.scrollTo({top:0,behavior:'smooth'});
  return;
 }
 rememberScroll();

/* ---------- 个股详情 ---------- */
function makeCandles(s,period){
 const seed=Number(s.id),count=period==='min'?40:32;
 return Array.from({length:count},(_,i)=>{
  const base=s.price*(.92+i/count*.08),wave=Math.sin((i+seed)*1.39)*s.price*.014;
  let close=Math.round(base+wave),open=Math.round(base+Math.sin((i+seed)*2.1)*s.price*.01);
  if(i===count-1){close=s.price;open=period==='min'?s.price-12:s.prev+32;}
  const date=new Date(Date.UTC(2026,10,10));
  if(period==='week')date.setUTCDate(date.getUTCDate()-(count-1-i)*7);
  else if(period==='month')date.setUTCMonth(date.getUTCMonth()-(count-1-i));
  else date.setUTCDate(date.getUTCDate()-(count-1-i));
  const label=period==='min'?`10:${String(i).padStart(2,'0')}`:period==='month'?`${date.getUTCFullYear()}/${date.getUTCMonth()+1}`:`${date.getUTCMonth()+1}/${String(date.getUTCDate()).padStart(2,'0')}`;
  return {open,close,high:Math.max(open,close)+Math.round(s.price*.006),low:Math.min(open,close)-Math.round(s.price*.006),volume:15+(i*17+seed)%65,label};
 });
}
function candlesFor(r){const p=r.period||'day';r.series||={};return r.series[p]||=(makeCandles(stock(r.id),p));}
function chartReadout(r){const bars=candlesFor(r),b=bars[r.cross??bars.length-1];
 if(r.cross===undefined)return `<span>${b.label}&nbsp;&nbsp;收 <strong class="number">${plain(b.close)}</strong>&nbsp;&nbsp;拖动图表查看历史</span>`;
 return `<span class="number">${b.label}&nbsp;&nbsp;开 <strong>${plain(b.open)}</strong>&nbsp; 高 <strong>${plain(b.high)}</strong>&nbsp; 低 <strong>${plain(b.low)}</strong>&nbsp; 收 <strong>${plain(b.close)}</strong></span><button class="link" data-action="clear-cross">回到最新</button>`;}
const CHART={W:350,left:2,right:40,top:8,bottom:168};
function chartSVG(r){const p=r.period||'day',bars=candlesFor(r),{W,left,right,top,bottom}=CHART,low=Math.min(...bars.map(b=>b.low)),high=Math.max(...bars.map(b=>b.high)),step=(W-left-right)/bars.length,Y=v=>top+(high-v)/(high-low)*(bottom-top);let shapes='';
 for(let i=0;i<4;i++){const y=top+i*(bottom-top)/3,v=high-(high-low)*i/3;shapes+=`<path class="g" d="M${left} ${y}H${W-right}"/><text class="ax" x="${W-1}" y="${y+3}" text-anchor="end">${plain(v)}</text>`;}
 if(p==='min'){const pts=bars.map((b,i)=>`${left+(i+.5)*step},${Y(b.close)}`).join(' ');shapes+=`<path class="area" d="M${left+step/2} ${bottom}${bars.map((b,i)=>`L${left+(i+.5)*step} ${Y(b.close)}`).join('')}L${left+(bars.length-.5)*step} ${bottom}Z"/><polyline class="ln" points="${pts}"/>`;}
 else bars.forEach((b,i)=>{const x=left+(i+.5)*step,c=b.close>=b.open?'rise':'fall';shapes+=`<path class="${c}" d="M${x} ${Y(b.high)}V${Y(b.low)}" stroke-width="1"/><rect class="${c}" x="${x-step*.3}" y="${Y(Math.max(b.open,b.close))}" width="${step*.6}" height="${Math.max(1,Math.abs(Y(b.open)-Y(b.close)))}" rx=".6" stroke="none"/>`;});
 bars.forEach((b,i)=>shapes+=`<rect class="${b.close>=b.open?'rise':'fall'} vol" x="${left+i*step+1.2}" y="${210-b.volume*.3}" width="${Math.max(2,step-2.4)}" height="${b.volume*.3}" rx=".6" stroke="none"/>`);
 if(r.cross!==undefined){const b=bars[r.cross],x=left+(r.cross+.5)*step;shapes+=`<path class="xh" d="M${x} 4V212M${left} ${Y(b.close)}H${W-right}"/><circle class="xd" cx="${x}" cy="${Y(b.close)}" r="3"/>`;}
 shapes+=`<text class="ax" x="3" y="226">${bars[0].label}</text><text class="ax" x="${W-right}" y="226" text-anchor="end">${bars.at(-1).label}</text>`;
 return `<svg class="chart-svg" viewBox="0 0 ${W} 232" aria-hidden="true">${shapes}</svg>`;}
function chartArea(r){const period=r.period||'day';return `<div class="chart-head"><div class="tabs" aria-label="图表周期">${[['min','分时'],['day','日K'],['week','周K'],['month','月K']].map(([v,t])=>`<button class="${period===v?'on':''}" data-action="period" data-value="${v}" aria-pressed="${period===v}">${t}</button>`).join('')}</div></div><div class="readout" id="chart-readout">${chartReadout(r)}</div><div id="chart-graphic" tabindex="0" role="img" aria-label="${stock(r.id).name}${period==='min'?'分时':'K线'}图，左右方向键查看历史读数">${chartSVG(r)}</div>`;}

 `<main class="screen"><section class="hero"><div class="price">${priceHTML(s)}</div><div class="move"><span class="number ${tone(delta(s))}" data-delta="${s.id}">${signed((s.price-s.prev)/100)}</span>${changeHTML(s)}</div><p class="stamp">HKD · 更新于 <span class="number" data-quote-time>${hkTime()}</span></p></section>

 <div class="sec"><h2>盘口</h2><span>每手 100 股</span></div>

function validateDraft(t){
 if(!/^\d{1,5}(\.\d{1,2})?$/.test(t.price))return {field:'price',message:'价格最多保留两位小数'};
 const p=Math.round(Number(t.price)*100),q=Number(t.qty);
 if(p<100||p>1000000)return {field:'price',message:'请输入 1.00–10,000.00 HKD 之间的价格'};
 if(!/^\d+$/.test(t.qty)||!Number.isSafeInteger(q)||q<100||q>100000||q%100)return {field:'quantity',message:'数量须为 100 的整数倍，最多 100,000 股'};
 if(t.side==='BUY'&&p*q+fee(p*q)>account(user()).available)return {field:'quantity',message:'可用资金不足，请减少数量或调整价格'};
 if(t.side==='SELL'&&q>sellable(user(),t.id))return {field:'quantity',message:'可卖数量不足，请减少数量'};
 return null;
}
function updateEstimate(){if(task?.type!=='trade'||task.stage!=='edit')return;const p=Math.round(Number(task.price)*100),q=Number(task.qty),valid=Number.isFinite(p)&&p>0&&Number.isSafeInteger(q)&&q>0&&q<=100000,f=valid?fee(p*q):0;document.getElementById('estimate-fee').textContent=valid?money(f)+' HKD':'—';document.getElementById('estimate-total').textContent=valid?money(p*q+(task.side==='BUY'?f:-f))+' HKD':'—';taskLayer.querySelectorAll('.chips [data-action="quantity"]').forEach(b=>b.classList.toggle('on',b.dataset.value===task.qty));}
function previewTrade(){const error=validateDraft(task);if(error){showFieldError(error.field,error.message);return;}writeHistory();task={...task,stage:'confirm',level:2,preview:{id:task.id,side:task.side,price:Math.round(Number(task.price)*100),qty:Number(task.qty),expires:Date.now()+15000,used:false}};writeHistory(true);renderTask();}
function showFieldError(field,message){const input=document.getElementById(field==='price'?'limit-price':'quantity');document.getElementById(field+'-error').textContent=message;input.setAttribute('aria-invalid','true');input.focus();}
function submitOrder(){
 if(task?.stage!=='confirm'||task.preview.used)return;const p=task.preview;
 if(Date.now()>=p.expires){updateCountdown();return;}
 const error=validateDraft({id:p.id,side:p.side,price:plain(p.price),qty:String(p.qty)});
 if(error){document.getElementById('submit-error').textContent=error.message+'，请返回修改。';return;}
 p.used=true;document.getElementById('submit-order').disabled=true;
 const now=new Date(),o={id:'H'+now.getTime().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase(),idStock:p.id,side:p.side,price:p.price,qty:p.qty,filled:0,notional:0,fee:0,spent:0,reserved:p.price*p.qty+fee(p.price*p.qty),status:'OPEN',ack:false,date:new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Hong_Kong'}).format(now),time:hkTime(now)};
 user().orders.push(o);save();drafts.delete(p.id+':'+p.side);
 closeTask(()=>present({type:'trade',stage:'result',orderId:o.id}));
}
function updateCountdown(){if(task?.stage!=='confirm')return;const seconds=Math.max(0,Math.ceil((task.preview.expires-Date.now())/1000)),el=document.getElementById('countdown');if(!el)return;el.querySelector('.ring b').textContent=seconds;el.querySelector(':scope>span').textContent=seconds?'秒内确认有效，过期需重新核对':'确认已过期，请返回重新核对';el.classList.toggle('expired',!seconds);document.getElementById('submit-order').hidden=!seconds;document.getElementById('submit-order').disabled=!seconds||task.preview.used;document.getElementById('expired-back').hidden=Boolean(seconds);}
function toggleWatch(id){requireUser(()=>{const u=user(),i=u.watch.indexOf(id);if(i<0)u.watch.push(id);else u.watch.splice(i,1);save();const on=i<0;
 const found=document.querySelectorAll(`.star[data-id="${id}"]`);
 if(!found.length){rememberScroll();renderRoot();return;}
 found.forEach(b=>{b.classList.toggle('on',on);b.innerHTML=icon('star',on);b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',on?'移除自选':'加入自选');b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');});});}
function cancelOrder(id){const o=user().orders.find(x=>x.id===id);if(!o||!active(o))return;ask('撤销剩余委托？',`${stock(o.idStock).name}，尚有 ${o.qty-o.filled} 股未成交。撤单后释放对应冻结，已成交部分保留。`,'确认撤单',()=>{if(active(o)){o.status='CANCELED';o.canceledAt=hkTime();save();updateLive();}else{updateLive();toast('委托已经成交，无法撤销');}});}

/* ================= 实时刷新：只改变化的数字 ================= */
function setText(el,value){if(el.textContent===value)return false;el.textContent=value;return true;}
function flash(el){el.classList.remove('tick');void el.offsetWidth;el.classList.add('tick');}
function patchQuotes(){
 for(const s of STOCKS){for(const [key,value] of [['price',plain(s.price)],['percent',signed(delta(s))+'%'],['delta',signed((s.price-s.prev)/100)],['bid',plain(s.price-1)],['ask',plain(s.price+1)]])document.querySelectorAll(`[data-${key}="${s.id}"]`).forEach(el=>{if(setText(el,value)&&key==='price')flash(el);if(key==='percent'||key==='delta'){el.classList.toggle('rise',s.price>=s.prev);el.classList.toggle('fall',s.price<s.prev);}});}
 const up=STOCKS.filter(s=>s.price>=s.prev).length;
 document.querySelectorAll('[data-breadth-up]').forEach(el=>el.textContent=up);document.querySelectorAll('[data-breadth-down]').forEach(el=>el.textContent=STOCKS.length-up);document.querySelectorAll('[data-breadth-bar]').forEach(el=>el.style.flex=el.dataset.breadthBar==='up'?up:STOCKS.length-up);
 document.querySelectorAll('[data-quote-time]').forEach(el=>el.textContent=hkTime());
}
function updateHoldings(u){const container=document.getElementById('holdings');if(!container)return;const ids=Object.keys(u.positions);container.querySelectorAll('[data-holding]').forEach(el=>{if(!ids.includes(el.dataset.holding))el.remove();});for(const id of ids){const p=u.positions[id];let row=container.querySelector(`[data-holding="${id}"]`);if(!row){container.insertAdjacentHTML('beforeend',holdingHTML(id,p));row=container.lastElementChild;}const pnl=stock(id).price*p.qty-p.cost;row.querySelector('[data-holding-field="value"]').textContent=money(stock(id).price*p.qty);row.querySelector('[data-holding-field="qty"]').textContent=`${p.qty} 股 · 可卖 ${sellable(u,id)}`;const el=row.querySelector('[data-holding-field="pnl"]');el.textContent=signed(pnl/100);el.classList.toggle('rise',pnl>=0);el.classList.toggle('fall',pnl<0);}
 document.getElementById('holdings-empty').hidden=Boolean(ids.length);document.querySelectorAll('[data-position-count]').forEach(el=>el.textContent=ids.length+' 只');}
function updateOrders(u){
 document.querySelectorAll('[data-order-row]').forEach(row=>{const o=u.orders.find(x=>x.id===row.dataset.orderRow);if(!o)return;row.querySelectorAll('[data-order-field="status"]').forEach(el=>{el.textContent=orderStatus(o);el.classList.toggle('terminal',!active(o));});row.querySelectorAll('[data-order-field="filled"]').forEach(el=>el.textContent=o.filled);if(current().page==='orders'&&(current().view||'orders')==='orders')row.hidden=(current().filter||'active')==='active'&&!active(o);});
 const emptyEl=document.getElementById('orders-empty');if(emptyEl)emptyEl.hidden=u.orders.some(o=>(current().filter||'active')==='all'||active(o));
 const tradeList=document.getElementById('trade-list');if(tradeList&&tradeList.childElementCount!==u.trades.length){tradeList.insertAdjacentHTML('afterbegin',u.trades.slice(tradeList.childElementCount).reverse().map(tradeRow).join(''));document.getElementById('trades-empty').hidden=Boolean(u.trades.length);}
}
function updateLive(){patchQuotes();refreshRegions();updateDock();const u=user();if(!u)return;const a=account(u);
 document.querySelectorAll('[data-money]').forEach(el=>{const value=a[el.dataset.money];if(el.dataset.masked==='true')el.textContent='••••••';else{const sign=el.dataset.signed==='true';el.textContent=sign?signed(value/100):money(value);if(sign){el.classList.toggle('rise',value>=0);el.classList.toggle('fall',value<0);}}});
 document.querySelectorAll('[data-mine-pnl]').forEach(el=>{const p=u.positions[el.dataset.minePnl];if(!p)return;const pnl=stock(el.dataset.minePnl).price*p.qty-p.cost;el.textContent=signed(pnl/100);el.classList.toggle('rise',pnl>=0);el.classList.toggle('fall',pnl<0);});
 const count=u.orders.filter(active).length;document.querySelectorAll('[data-open-orders]').forEach(el=>el.textContent=count?count+' 笔进行中':'');
 updateHoldings(u);updateOrders(u);
 if(task?.stage==='edit'){const el=document.getElementById('trade-available');if(el)el.textContent=task.side==='BUY'?money(a.available)+' HKD':sellable(u,task.id)+' 股';}}
function clearTradeErrors(){for(const id of ['price','quantity']){const el=document.getElementById(id+'-error');if(el)el.textContent='';}taskLayer.querySelectorAll('[aria-invalid]').forEach(el=>el.removeAttribute('aria-invalid'));}

/* ================= 手势：图表十字线、自选拖拽 ================= */
function setCross(index){const r=current(),bars=candlesFor(r);r.cross=Math.max(0,Math.min(bars.length-1,index));document.getElementById('chart-graphic').firstElementChild.outerHTML=chartSVG(r);document.getElementById('chart-readout').innerHTML=chartReadout(r);}
function crossFromPointer(event){const box=event.currentTarget.getBoundingClientRect(),scale=box.width/CHART.W,x=(event.clientX-box.left)/scale,bars=candlesFor(current()),step=(CHART.W-CHART.left-CHART.right)/bars.length;setCross(Math.floor((x-CHART.left)/step));}
workspace.addEventListener('pointerdown',event=>{
 const chart=event.target.closest('#chart-graphic');
 if(chart){chart.setPointerCapture(event.pointerId);crossFromPointer({currentTarget:chart,clientX:event.clientX});const onMove=e=>crossFromPointer({currentTarget:chart,clientX:e.clientX});const end=()=>{chart.removeEventListener('pointermove',onMove);chart.removeEventListener('pointerup',end);chart.removeEventListener('pointercancel',end);};chart.addEventListener('pointermove',onMove);chart.addEventListener('pointerup',end);chart.addEventListener('pointercancel',end);return;}
 const grip=event.target.closest('[data-drag]');if(grip)startDrag(event,grip);
});
function startDrag(event,grip){
 event.preventDefault();const r=current(),list=document.getElementById('manage-list'),rows=[...list.children],from=Number(grip.dataset.drag),row=rows[from],h=row.getBoundingClientRect().height,startY=event.clientY;let target=from;
 grip.setPointerCapture(event.pointerId);row.classList.add('lifted');
 const onMove=e=>{const dy=e.clientY-startY;row.style.transform=`translateY(${dy}px) scale(1.02)`;target=Math.max(0,Math.min(rows.length-1,from+Math.round(dy/h)));rows.forEach((el,j)=>{if(el===row)return;const shift=from<j&&j<=target?-h:target<=j&&j<from?h:0;el.style.transform=shift?`translateY(${shift}px)`:'';});};
 const end=()=>{grip.removeEventListener('pointermove',onMove);grip.removeEventListener('pointerup',end);grip.removeEventListener('pointercancel',end);row.classList.remove('lifted');row.style.transform=`translateY(${(target-from)*h}px)`;
  setTimeout(()=>{if(target!==from){const [id]=r.list.splice(from,1);r.list.splice(target,0,id);}rememberScroll();renderRoot();document.querySelector(`[data-drag="${target}"]`)?.focus({preventScroll:true});},260);};
 grip.addEventListener('pointermove',onMove);grip.addEventListener('pointerup',end);grip.addEventListener('pointercancel',end);
}
workspace.addEventListener('keydown',event=>{
 const grip=event.target.closest('[data-drag]');
 if(grip&&(event.key==='ArrowUp'||event.key==='ArrowDown')){event.preventDefault();const r=current(),i=Number(grip.dataset.drag),j=i+(event.key==='ArrowUp'?-1:1);if(j<0||j>=r.list.length)return;[r.list[i],r.list[j]]=[r.list[j],r.list[i]];rememberScroll();renderRoot();document.querySelector(`[data-drag="${j}"]`)?.focus();return;}
 if(event.target.id==='chart-graphic'&&(event.key==='ArrowLeft'||event.key==='ArrowRight')){event.preventDefault();const r=current(),bars=candlesFor(r);setCross((r.cross??bars.length-1)+(event.key==='ArrowLeft'?-1:1));}
});

/* ================= 操作分发 ================= */
function onAction(event){const button=event.target.closest('[data-action]');if(!button||button.disabled||!button.dataset.action)return;const action=button.dataset.action,value=button.dataset.value,id=button.dataset.id,r=current();switch(action){
 case 'tab':selectTab(button.dataset.tab);break;
 case 'back':back();break;
 case 'search':push({page:'search',query:''});setTimeout(()=>document.getElementById('search-input')?.focus(),60);break;
 case 'detail':push({page:'detail',id});break;
 case 'browse':push({page:'browse'});break;
 case 'rank':rememberScroll();r.rank=value;writeHistory();renderRoot();break;
 case 'sort':rememberScroll();r.sort=value;writeHistory();renderRoot();break;
 case 'manage':requireUser(()=>push({page:'manage',list:[...user().watch]}));break;
 case 'remove-watch':rememberScroll();r.list=r.list.filter(x=>x!==id);renderRoot();break;
 case 'save-watch':user().watch=[...r.list];save();back();break;
 case 'toggle-watch':toggleWatch(id);break;
 case 'period':r.period=value;delete r.cross;document.getElementById('chart-area').innerHTML=chartArea(r);break;
 case 'clear-cross':delete r.cross;document.getElementById('chart-area').innerHTML=chartArea(r);break;
 case 'fund-range':r.fundRange=value;document.getElementById('fund-body').innerHTML=fundBody(r);{const net=fundNet(r),el=document.getElementById('fund-net');el.textContent='净流入 '+signed(net/1000000)+' 万';el.classList.toggle('rise',net>=0);el.classList.toggle('fall',net<0);}break;
 case 'trade':beginTrade(id);break;
 case 'sell':beginTrade(id,'SELL');break;
 case 'balance':rememberScroll();r.hidden=!r.hidden;renderRoot();break;
 case 'orders':push({page:'orders',view:'orders',filter:'active'});break;
 case 'order':viewOrder(button.dataset.order);break;
 case 'ack':{const o=user()?.orders.find(x=>x.id===button.dataset.order);if(o){o.ack=true;save();refreshRegions();}break;}
 case 'order-view':rememberScroll();r.view=value;r.scroll=0;writeHistory();renderRoot();break;
 case 'order-filter':r.filter=value;writeHistory();updateOrders(user());button.parentElement.querySelectorAll('button').forEach(el=>{el.classList.toggle('on',el===button);el.setAttribute('aria-pressed',String(el===button));});break;
 case 'cancel-order':cancelOrder(button.dataset.order);break;
 case 'settings':push({page:'settings'});break;
 case 'rules':push({page:'rules'});break;
 case 'pref':prefs[button.dataset.key]=value;savePrefs();button.parentElement.querySelectorAll('button').forEach(el=>{el.classList.toggle('on',el===button);el.setAttribute('aria-pressed',String(el===button));});break;
 case 'go-watch':selectTab('watch');break;
 case 'logout':ask('退出登录？','退出后结束当前账户的私有内容，公开行情仍可浏览。','退出',logout);break;
 case 'login':afterAuth=null;present({type:'auth',mode:'login'});break;
 case 'demo':if(task?.type==='auth')login('demo@harbor.app');else{db.active='demo@harbor.app';save();renderRoot();toast('已登录演示账户');}break;
 case 'close-task':if(task?.type==='auth')afterAuth=null;closeTask();break;
 case 'task-back':goBack();break;
 case 'view-order':viewOrder(button.dataset.order);break;
 case 'side':drafts.set(task.id+':'+task.side,{price:task.price,qty:task.qty});task.side=value;{const draft=drafts.get(task.id+':'+value);task.price=draft?.price||plain(stock(task.id).price+(value==='BUY'?1:-1));task.qty=draft?.qty||'100';}renderTask();break;
 case 'opponent':task.price=plain(stock(task.id).price+(task.side==='BUY'?1:-1));document.getElementById('limit-price').value=task.price;clearTradeErrors();updateEstimate();break;
 case 'step':{const field=button.dataset.field,stepN=Number(button.dataset.step);clearTradeErrors();if(field==='price'){const cur=Math.round(Number(task.price)*100);const next=Number.isFinite(cur)&&cur>0?cur+stepN:stock(task.id).price;task.price=plain(Math.max(100,Math.min(1000000,next)));document.getElementById('limit-price').value=task.price;}else{const cur=Number(task.qty);const next=Number.isSafeInteger(cur)?Math.floor(cur/100)*100+stepN*100:100;task.qty=String(Math.max(100,Math.min(100000,next)));document.getElementById('quantity').value=task.qty;}updateEstimate();break;}
 case 'quantity':task.qty=value;document.getElementById('quantity').value=value;clearTradeErrors();updateEstimate();break;
 case 'max-quantity':{const p=Math.round(Number(task.price)*100);if(!p||p<100){showFieldError('price','请先填写有效价格');break;}let q=task.side==='SELL'?sellable(user(),task.id):Math.min(100000,Math.floor(account(user()).available/p/100)*100);while(q>0&&task.side==='BUY'&&q*p+fee(q*p)>account(user()).available)q-=100;task.qty=String(Math.min(100000,q));document.getElementById('quantity').value=task.qty;clearTradeErrors();updateEstimate();break;}
 case 'submit-order':submitOrder();break;
 case 'auth-mode':task.mode=task.mode==='register'?'login':'register';renderTask();break;
 case 'password':{const input=document.getElementById('auth-password');input.type=input.type==='password'?'text':'password';button.textContent=input.type==='password'?'显示':'隐藏';button.setAttribute('aria-label',button.textContent+'密码');break;}
}}
document.getElementById('app').addEventListener('click',onAction);
document.getElementById('app').addEventListener('input',event=>{const input=event.target;if(input.id==='search-input'){current().query=input.value;document.getElementById('search-results').innerHTML=searchResults(input.value);}else if(input.closest('#trade-form')){task[input.name==='price'?'price':'qty']=input.value;clearTradeErrors();updateEstimate();}else if(input.closest('#auth-form')){task[input.name]=input.value;input.removeAttribute('aria-invalid');document.getElementById('auth-error').textContent='';}});
workspace.addEventListener('toggle',event=>{if(event.target.dataset.detail)current()[{analysis:'analysisOpen'}[event.target.dataset.detail]]=event.target.open;},true);
document.getElementById('app').addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='trade-form')previewTrade();else if(event.target.id==='auth-form'){const email=(task.email||'').trim().toLowerCase(),password=task.password||'',name=(task.name||'').trim();let error='';if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))error='请输入有效的模拟邮箱';else if(password.length<8||password.length>128)error='密码长度须为 8–128 位';else if(task.mode==='register'){if(db.users[email])error='该邮箱已经注册，请直接登录';else{db.users[email]=newUser((name||email.split('@')[0]).slice(0,24),email,password);login(email);}}else if(db.users[email]?.password!==password)error='邮箱或密码不正确，请重新输入';else login(email);if(error){const message=document.getElementById('auth-error');message.textContent=error;const input=document.getElementById(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)?'auth-email':'auth-password');input.setAttribute('aria-invalid','true');input.setAttribute('aria-describedby','auth-error');input.focus();}}});
document.addEventListener('keydown',event=>{if(!task||document.getElementById('confirm-dialog').open)return;if(event.key==='Escape'){event.preventDefault();if(task.type==='auth')afterAuth=null;closeTask();}else if(event.key==='Tab'){const items=[...taskLayer.querySelectorAll('button:not(:disabled),input:not(:disabled),[href]')].filter(el=>el.getClientRects().length&&!el.hidden),first=items[0],last=items.at(-1);if(event.shiftKey&&(document.activeElement===first||document.activeElement===document.getElementById('task-title'))){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}});
window.addEventListener('resize',updateDock);
setInterval(()=>{updateCountdown();if(document.hidden)return;tick++;if(tick%2===0)STOCKS.forEach((s,i)=>s.price+=((tick/2+i)%3)-1);settle();updateLive();},1500);
writeHistory();renderRoot();
</script>
